<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Graph Paper Tank Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&amp;family=Patrick+Hand&amp;display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one full-screen canvas. Square arena in the middle of a sheet of graph paper,
     one control strip per player at the two short ends of the tablet. Single theme by choice. */
  --paper: #f5f7f3;
  --grid: #b6d0ea;
  --margin-line: #eda3ab;
  --graphite: #343941;
  --red-pen: #d32d3b;
  --blue-pen: #1c4ec2;
  --green-pen: #1b8450;
  --orange-pen: #d06a12;
  --violet-pen: #7b3ab4;
  --grass-pen: #5f8f2f;
  --water-ink: #3f93c9;
  --zombie-ink: #5f6873;
  --font-display: "Gochi Hand", "Marker Felt", "Chalkboard SE", "Comic Sans MS", cursive;
  --font-body: "Patrick Hand", "Chalkboard SE", "Comic Sans MS", cursive;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--paper); color: var(--graphite); }
body {
  position: fixed; inset: 0;
  touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  font-family: var(--font-body);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#namebox {
  position: fixed; z-index: 5; left: 50%; top: max(14px, env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; max-width: calc(100% - 32px); box-sizing: border-box;
  background: var(--paper); border: 2px solid var(--graphite); border-radius: 14px; box-shadow: 0 6px 0 rgba(52, 57, 65, 0.18);
  font-family: var(--font-body); font-size: 20px;
}
#namebox[hidden] { display: none; }
#namebox input {
  width: 9.5em; min-width: 0; font: inherit; color: var(--graphite); background: #fff; padding: 6px 10px;
  border: 2px solid var(--graphite); border-radius: 10px; -webkit-user-select: text; user-select: text; touch-action: manipulation;
}
#namebox input:focus-visible, #namebox button:focus-visible { outline: 3px solid var(--blue-pen); outline-offset: 2px; }
#namebox button {
  font: inherit; font-family: var(--font-display); color: var(--paper); background: var(--red-pen);
  border: 0; border-radius: 10px; padding: 7px 16px; touch-action: manipulation;
}
noscript { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; }
</style>
</head>
<body>
<canvas id="game" role="img" aria-label="Tank Duel: a two-player tank game played on one touch screen"></canvas>
<div id="namebox" hidden>
  <label for="nameinput">Your name</label>
  <input id="nameinput" type="text" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
  <button id="nameok" type="button">OK</button>
</div>
<noscript>This game needs JavaScript turned on.</noscript>

  MINION_SPEED: 1.35,

  WAVE_EVERY: 20,        // ...and between waves

  RESPAWN_GROW: 1 / 60,  // base mode: the wait to come back grows by a second for every minute played

  // terrain

  GRASS_REVEAL: 0.8,     // ...or for this long after it fires

};

for (const m of [

    "...............",
    "...T.......T...",
    "..#....1....#..",
    ".....#...#.....",

let COLS = 11, ROWS = 11;      // size of the map being played; set by loadMap
const DIRS4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const POWER_TYPES = ['laser', 'homing', 'guided', 'shield', 'spread', 'mine', 'pierce', 'bomb'];
const POWER_NAME = { laser: 'LASER', homing: 'HOMING', guided: 'GUIDED', shield: 'SHIELD', spread: 'SPREAD', mine: 'MINE', pierce: 'PIERCE', bomb: 'BOMB' };
const MISSILE_TYPES = ['homing', 'guided', 'bomb'];

/* ---------- helpers ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const wrapAngle = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function distToSeg(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy;
  const u = l2 > 0 ? clamp(((px - ax) * vx + (py - ay) * vy) / l2, 0, 1) : 0;
  return Math.hypot(px - (ax + vx * u), py - (ay + vy * u));
}

const css = getComputedStyle(document.documentElement);
const tok = n => css.getPropertyValue(n).trim();
const COL = {
  paper: tok('--paper'), grid: tok('--grid'), margin: tok('--margin-line'),
  graphite: tok('--graphite'),
  pens: [tok('--red-pen'), tok('--blue-pen'), tok('--green-pen'), tok('--orange-pen'), tok('--violet-pen')],
  grass: tok('--grass-pen') || '#5f8f2f', water: tok('--water-ink') || '#3f93c9', zombie: tok('--zombie-ink') || '#5f6873'
};
const PEN_NAMES = ['Red', 'Blue', 'Green', 'Orange', 'Violet'];
/* ---------- party rules: one twist for a round, by changing the tuning above ---------- */
const MUTS = {
  bouncy: { name: 'Super bounce', text: 'Shots bounce 15 times and last 9 seconds.' },
  fast: { name: 'Turbo', text: 'Tanks drive and turn much faster.' },
  big: { name: 'Big tanks', text: 'Bigger tanks: easier to hit, harder to squeeze past walls.' },
  rapid: { name: 'Rapid fire', text: 'Shots come three times as fast, up to 12 at once.' },
  storm: { name: 'Pickup storm', text: 'Power-ups keep raining down.' },
  slow: { name: 'Slow shots', text: 'Shots crawl: dodge them, or box someone in.' },
  bank: { name: 'Bank shots', text: 'A shot only hurts after it has bounced off a wall.' },
  fog: { name: 'Fog', text: 'You only see tanks within 3 cells of your side.' }
};
const MUT_IDS = Object.keys(MUTS);
const C0 = Object.assign({}, C);              // the tuning with no party rule
let mutNow = '';                              // the party rule of the round being played
function applyMut(id) {
  Object.assign(C, C0);
  mutNow = MUTS[id] ? id : '';
  if (mutNow === 'bouncy') { C.MAX_BOUNCES = 15; C.BULLET_LIFE = 9; }
  else if (mutNow === 'fast') { C.TANK_SPEED *= 1.6; C.TURN_RATE *= 1.5; }
  else if (mutNow === 'big') C.TANK_R = 0.42;
  else if (mutNow === 'rapid') { C.FIRE_COOLDOWN = 0.1; C.MAX_BULLETS = 12; C.CLIP_SIZE = 12; C.RELOAD_TIME = 1.5; }
  else if (mutNow === 'storm') { C.PICKUP_FIRST = 1; C.PICKUP_INTERVAL = 1.2; }
  else if (mutNow === 'slow') { C.BULLET_SPEED *= 0.5; C.BULLET_LIFE = 10; }
}
// the rule for a new round: the one chosen, or a random one (not the last one again; no fog on a shared screen)
function pickMut() {
  if (settings.mut !== 'random') return MUTS[settings.mut] ? settings.mut : '';
  const pool = MUT_IDS.filter(id => id !== mutNow && !(id === 'fog' && mode === 'local' && !soloMatch));

}
const MAX_PLAYERS = 5;
const FONT_D = tok('--font-display'), FONT_B = tok('--font-body');

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const st = document.createElement('canvas');   // static layer: paper, grid, walls, water
const gst = document.createElement('canvas');  // grass, drawn over the tanks

/* ---------- settings ---------- */
const AMMO_MODES = ['unlimited', 'reload', 'limited', 'single'];
const MAP_POOLS = ['all', 'classic', 'complex'], WIN_SCORES = [3, 5, 7];
// classic: last tank standing takes the round. teams: the same, two sides. dm: destroyed tanks come back
// and kills are counted. hill: tanks come back, and holding the circle in the middle scores.
const GAME_MODES = ['classic', 'dm', 'hill', 'zombie', 'teams', 'base'];
const GAME_NAME = { classic: 'Classic', teams: 'Teams', dm: 'Deathmatch', hill: 'Hill', base: 'Base', zombie: 'Infection' };
const GAME_TEXT = {
  classic: 'Last tank standing wins the round.',
  zombie: 'One tank starts as a zombie; anyone it touches turns. Last to survive scores.',
  teams: 'Two teams; your side cannot hit you. Needs 3 or more tanks.',
  dm: 'Destroyed tanks come back. Every kill is a point.',
  hill: 'Stand alone in the circle in the middle to score.',
  base: 'Two teams: take down a tower, then their base.'
};
const BASE_TIME = { 3: 240, 5: 360, 7: 480 };          // base mode: seconds before the match is decided on what is left
const KILL_GOAL = { 3: 5, 5: 10, 7: 15 }, HILL_GOAL = { 3: 20, 5: 30, 7: 45 };
// soft: some walls break when shot. cpu: on one screen, play alone against this many computer tanks (0 = two people).
let settings = { ammo: 'unlimited', powerups: false, maps: 'all', winScore: C.WIN_SCORE, game: 'classic', soft: false, terrain: true, mut: 'off', cpu: 0 };
function validSettings(s) {
  if (!s || !AMMO_MODES.includes(s.ammo)) return null;
  return { ammo: s.ammo, powerups: !!s.powerups, maps: MAP_POOLS.includes(s.maps) ? s.maps : 'all',
    winScore: WIN_SCORES.includes(s.winScore) ? s.winScore : C.WIN_SCORE,
    game: GAME_MODES.includes(s.game) ? s.game : 'classic', soft: !!s.soft, terrain: s.terrain === undefined ? true : !!s.terrain,
    mut: s.mut === 'random' || MUTS[s.mut] ? s.mut : 'off', cpu: [1, 2, 3].includes(s.cpu) ? s.cpu : 0 };
}
// classic = the small 11x11 maps, complex = the 13x13 ones
function mapPool() {
  // base mode has maps of its own: 15 by 15 for up to three tanks, 17 by 17 for more
  if (settings.game === 'base') return [...BASEMAPS].filter(i => NP >= 4 ? MAPS[i].length > 15 : MAPS[i].length <= 15);
  const all = MAPS.map((_, i) => i).filter(i => !BASEMAPS.has(i));
  if (NP >= 4 || teamsOn()) return all.filter(i => MAPS[i].length > 11);   // four or five tanks, or teams, need the bigger maps
  if (NP === 3 && settings.maps !== 'classic') return all.filter(i => MAPS[i].length > 11);
  if (settings.maps === 'classic') return all.filter(i => MAPS[i].length <= 11);
  if (settings.maps === 'complex') return all.filter(i => MAPS[i].length > 11);
  return all;
}
// "1 per 5 s" is a magazine of one with a long refill; "5 + reload" is a magazine of five with a short one
const clipSize = () => settings.ammo === 'single' ? 1 : C.CLIP_SIZE;
const reloadTime = () => settings.ammo === 'single' ? C.SINGLE_COOLDOWN : C.RELOAD_TIME;
const refills = () => settings.ammo === 'reload' || settings.ammo === 'single';
try { settings = validSettings(JSON.parse(localStorage.getItem('tankduel-settings') || 'null')) || settings; } catch (e) {}

let muted = false;
try { muted = localStorage.getItem('tankduel-muted') === '1'; } catch (e) {}
let myName = '', nameOpen = false, nameSentAt = 0;
try { myName = String(localStorage.getItem('tankduel-name') || '').replace(/[<>]/g, '').trim().slice(0, 12); } catch (e) {}
const nameBox = document.getElementById('namebox'), nameInput = document.getElementById('nameinput'), nameOk = document.getElementById('nameok');
function openName() {
  if (!nameBox || !nameInput || typeof nameInput.focus !== 'function') return;

    for (const m of minions) if (m.team !== s.team) { const d = Math.hypot(m.x - s.x, m.y - s.y); if (d < bd && inSight(s.x, s.y, m.x, m.y, bd, 0.75, C.SHELL_R)) { best = m; bd = d; } }
    if (!best) for (const t of tanks) if (t.alive && !(t.inv > 0) && teamOf[t.id] !== s.team) { const d = Math.hypot(t.x - s.x, t.y - s.y); if (d < bd && inSight(s.x, s.y, t.x, t.y, bd, 0.75, C.SHELL_R)) { best = t; bd = d; } }
    if (!best) continue;
    s.aim = Math.atan2(best.y - s.y, best.x - s.x);
    if (s.cool <= 0) { s.cool = C.TOWER_RELOAD; shell(s.x, s.y, s.aim, s.team, 0.75, C.SHELL_SPEED, 'tower'); }
  }
  waveT -= dt;
  if (waveT <= 0) { waveT = C.WAVE_EVERY; spawnWave(); }
  stepMinions(dt);
  stepShells(dt);
  if (state === 'play' && roundT >= target()) endBase(-1);
}

// hill: one side alone in the circle scores a point a second
function hillStep(dt) {
  const cx = COLS / 2, cy = ROWS / 2;
  const inside = tanks.filter(t => t.alive && Math.hypot(t.x - cx, t.y - cy) < C.HILL_R);
  for (const t of inside) t.inv = 0;                      // stepping on the hill ends the protection
  hillHolder = inside.length === 1 ? inside[0].id : inside.length ? -2 : -1;
  if (hillHolder < 0) return;
  hillT[hillHolder] += dt;
  scores[hillHolder] = Math.floor(hillT[hillHolder]);
  if (scores[hillHolder] >= target() && state === 'play') { state = 'ending'; stateT = 0; }
}

/* ---------- actions ---------- */
// shots from power-ups (spread, pierce) do not count against the limit
function bulletCount(id) { let n = 0; for (const b of bullets) if (b.owner === id && !b.extra) n++; return n; }
function shotsLeft(t) {
  if (mode === 'guest') return t.left | 0;            // a guest is told this by the host
  return settings.ammo === 'unlimited' ? C.MAX_BULLETS - bulletCount(t.id) : t.ammo;
}

// start a projectile at the muzzle; if the muzzle is inside a wall, pull the start point back toward the tank
function muzzle(t, rad) {
  const dx = Math.cos(t.angle), dy = Math.sin(t.angle);
  let d = C.TANK_R + 0.14;
  while (d > 0 && circleHitsWall(t.x + dx * d, t.y + dy * d, rad)) d -= 0.04;
  d = Math.max(0, d);
  return { x: t.x + dx * d, y: t.y + dy * d, dx, dy };
}

function fire(t) {
  if (!t.alive || isZed(t.id)) return false;             // zombies have no gun
  if (t.guided) {                                      // second press: set the guided missile off
    if (t.guided.age < C.GUIDED_ARM) return false;
    t.guided.detonate = true; return true;
  }
  if (t.charge > 0 || t.cool > 0 || t.shield > 0) return false;
  if (t.power) return usePower(t);
  if (shotsLeft(t) <= 0) return false;
  const s = muzzle(t, C.BULLET_R);
  bullets.push({ id: ++entId, x: s.x, y: s.y, vx: s.dx * C.BULLET_SPEED, vy: s.dy * C.BULLET_SPEED, owner: t.id, age: 0, bounces: 0, trail: [], tick: 0 });
  if (stats[t.id]) stats[t.id].s++;
  if (settings.ammo !== 'unlimited') {
    t.ammo--;
    if (refills() && t.ammo <= 0) t.reload = reloadTime();
  }
  t.cool = C.FIRE_COOLDOWN; t.recoil = 1;
  for (let i = 0; i < 4; i++) {
    const a = t.angle + (Math.random() - 0.5) * 0.9, sp = 1 + Math.random() * 2;
    particles.push({ x: s.x, y: s.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.18, max: 0.18, col: COL.graphite, size: 0.035 });
  }
  sfx.shoot(t.id);
  netEv('shot', t.id, r2(s.x), r2(s.y), r2(t.angle));
  return true;
}

// host -> guests: a short ring of recent events, sent with every snapshot so a dropped message loses nothing
const r2 = v => Math.round(v * 100) / 100;
function netEv(...e) {
  if (mode !== 'host') return;
  netEvents.push({ at: performance.now(), e: [++netSeq, ...e] });
  if (netEvents.length > 24) netEvents.shift();
}

function usePower(t) {
  const type = t.power;
  t.power = null;
  const shot = extra => Object.assign({ id: ++entId, owner: t.id, age: 0, bounces: 0, trail: [], tick: 0, extra: true }, extra);
  netEv('sfx', type === 'spread' ? 'shoot' : type === 'pierce' ? 'pierce' : type === 'laser' ? 'charge' : type === 'shield' ? 'shield' : type === 'mine' ? 'drop' : 'launch', t.id);
  if (type === 'spread' || type === 'pierce' || type === 'homing' || type === 'guided' || type === 'laser' || type === 'bomb') netEv('recoil', t.id);
  if (type === 'laser') {
    t.recoil = 1; t.charge = C.LASER_CHARGE; t.laserPath = tracePath(t.x, t.y, t.angle);
    sfx.charge();
  } else if (type === 'shield') {
    t.shield = C.SHIELD_TIME;
    sfx.shield();
  } else if (type === 'mine') {
    mines.push({ id: ++entId, x: t.x, y: t.y, owner: t.id, age: 0, armed: false, boom: false });
    t.cool = C.FIRE_COOLDOWN;
    sfx.drop();
  } else if (type === 'spread') {
    const s = muzzle(t, C.BULLET_R);
    for (const k of [-1, 0, 1]) {
      const a = t.angle + k * C.SPREAD_ANGLE;
      bullets.push(shot({ x: s.x, y: s.y, vx: Math.cos(a) * C.BULLET_SPEED, vy: Math.sin(a) * C.BULLET_SPEED, life: C.SPREAD_LIFE, maxB: C.SPREAD_BOUNCES }));
    }
    t.cool = C.FIRE_COOLDOWN; t.recoil = 1;
    sfx.shoot(t.id);
  } else if (type === 'pierce') {
    const s = muzzle(t, C.BULLET_R);
    bullets.push(shot({ x: s.x, y: s.y, vx: s.dx * C.PIERCE_SPEED, vy: s.dy * C.PIERCE_SPEED, life: 9, pierce: true }));
    t.cool = C.FIRE_COOLDOWN; t.recoil = 1;
    sfx.pierce();
  } else {
    const s = muzzle(t, type === 'bomb' ? C.BOMB_R : C.MISSILE_R);
    const m = { id: ++entId, target: nearestEnemy(t.id, s.x, s.y), type, x: s.x, y: s.y, angle: t.angle, owner: t.id, age: 0, replan: 0, wp: null, tick: 0, detonate: false };
    missiles.push(m);
    if (type === 'guided') t.guided = m;
    t.cool = C.FIRE_COOLDOWN; t.recoil = 1;
    sfx.launch();
  }
  return true;
}

// Every hit goes through here: a shield takes one hit in the tank's place.
function hit(t, by = -1) {
  if (t.inv > 0) return false;                           // just came back: untouchable
  if (isZed(t.id) && t.hp > 1) {                         // a zombie shrugs off the first shot, staggered
    t.hp--; t.stun = Math.max(t.stun, 0.3);
    rings.push({ x: t.x, y: t.y, r: 0.7, life: 0.3, max: 0.3, col: COL.zombie });
    sfx.crack(); netEv('block', t.id, r2(t.x), r2(t.y));
    return false;
  }
  if (t.shield > 0) {
    t.shield = 0;
    rings.push({ x: t.x, y: t.y, r: 0.75, life: 0.3, max: 0.3, col: penOf(t.id) });
    sfx.block();
    netEv('block', t.id, r2(t.x), r2(t.y));
    return false;
  }
  kill(t, by);
  return true;
}

function fireLaser(t) {
  const path = t.laserPath = tracePath(t.x, t.y, t.angle);
  beams.push({ path, owner: t.id, life: 0.32, max: 0.32 });
  sfx.zap();
  netEv('laser', t.id, r2(t.x), r2(t.y), r2(t.angle));
  if (!REDUCED) shake = Math.max(shake, 0.12);
  // the beam cannot hurt the tank that fired it
  for (let i = missiles.length - 1; i >= 0; i--) {
    const m = missiles[i];
    if (m.owner !== t.id && pathDist(path, m.x, m.y) < C.MISSILE_R + 0.06) { removeMissile(i); if (m.type === 'bomb') blast(m); else puff(m.x, m.y, m.owner); }
  }
  for (const mn of mines) if (pathDist(path, mn.x, mn.y) < C.MINE_R + 0.05) mn.boom = true;
  if (!LETHAL) return;
  if (structs.length) {                                     // base mode: the beam hurts buildings where it strikes them, and minions on its way
    const ot = teamOf[t.id], done = new Set();
    for (let i = 1; i < path.length; i++) {
      const k = structAt(path[i].x, path[i].y, 0.08);
      if (k >= 0 && !done.has(k) && structs[k].team !== ot) { done.add(k); damageStruct(structs[k], 3, t.id); }
    }
    for (let j = minions.length - 1; j >= 0; j--) if (minions[j].team !== ot && pathDist(path, minions[j].x, minions[j].y) < C.MINION_R + 0.05) killMinion(j);
  }
  shotNow = { age: C.LASER_CHARGE, id: -1, n: path.length - 2 };
  for (const o of tanks) if (o !== t && o.alive && canHurt(t.id, o) && pathDist(path, o.x, o.y) < C.TANK_R * 0.92 + 0.04) hit(o, t.id);
  shotNow = null;
}

// the closest living tank on another side than `id` (falls back to `id` itself when nobody is left)
function nearestEnemy(id, x, y) {
  let best = id, bd = Infinity;
  for (const o of tanks) {
    if (o.id === id || !o.alive || friendOf(o.id, id)) continue;
    const d = Math.hypot(o.x - x, o.y - y);
    if (d < bd) { bd = d; best = o.id; }
  }
  return best;
}

function removeMissile(i) {
  const m = missiles[i];
  missiles.splice(i, 1);
  const o = tanks[m.owner];
  if (o.guided === m) { o.guided = null; o.cool = C.FIRE_COOLDOWN; }
}
function puff(x, y, owner) {
  const col = penOf(owner);
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2, s = 0.5 + Math.random() * 1.8;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.3, max: 0.3, col: i % 2 ? col : COL.graphite, size: 0.04 });
  }
  sfx.pop();
  netEv('puff', r2(x), r2(y), owner);
}
function blast(m) {
  const R = m.type === 'bomb' ? C.BOMB_BLAST : C.GUIDED_BLAST;
  const spare = m.type === 'bomb' && m.age < C.BOMB_ARM ? m.owner : -1;
  rings.push({ x: m.x, y: m.y, r: R, life: 0.4, max: 0.4, col: penOf(m.owner) });
  for (let i = 0; i < (R > 1 ? 30 : 22); i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 4, life = 0.25 + Math.random() * 0.4;
    particles.push({ x: m.x, y: m.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, col: i % 3 ? penOf(m.owner) : COL.graphite, size: 0.04 + Math.random() * 0.05 });
  }
  shake = Math.max(shake, 0.25);
  sfx.boom();
  netEv('blast', r2(m.x), r2(m.y), m.owner, R);
  for (const mn of mines) if (Math.hypot(mn.x - m.x, mn.y - m.y) < R) mn.boom = true;     // a blast sets off mines inside it
  if (settings.soft) {                                                                                   // ...and knocks down breakable walls
    for (let i = 0; i < soft.length; i++) if (soft[i] && Math.hypot(i % COLS + 0.5 - m.x, ((i / COLS) | 0) + 0.5 - m.y) < R + 0.35) breakWall(i);
  }
  if (!LETHAL) return;
  if (structs.length) {                                     // base mode: blasts hurt buildings and minions of the other side
    const ot = teamOf[m.owner];
    for (const s of structs) if (s.team !== ot && s.hp > 0 && Math.hypot(s.x - m.x, s.y - m.y) < R + 0.6) damageStruct(s, m.type === 'bomb' ? 3 : 2, m.owner);
    for (let j = minions.length - 1; j >= 0; j--) if (minions[j].team !== ot && Math.hypot(minions[j].x - m.x, minions[j].y - m.y) < R + C.MINION_R) killMinion(j);
  }
  const was = shotNow; shotNow = { age: m.age || 0, id: -1, n: 0 };
  for (const t of tanks) if (t.alive && t.id !== spare && canHurt(m.owner, t) && Math.hypot(t.x - m.x, t.y - m.y) < R) hit(t, m.owner);
  shotNow = was;
}

function kill(t, by = -1) {
  if (state === 'play' || state === 'ending') noteKill(t.id, by);
  t.alive = false; t.charge = 0;
  const seed = (Math.random() * 1e9) | 0;
  marks.push({ x: t.x, y: t.y, col: penOf(t.id), seed });
  netEv('kill', t.id, r2(t.x), r2(t.y), seed);
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 4.5, life = 0.35 + Math.random() * 0.6;
    particles.push({ x: t.x, y: t.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, col: i % 3 ? penOf(t.id) : COL.graphite, size: 0.04 + Math.random() * 0.06 });
  }
  shake = 0.35;
  sfx.boom();
  if (stats[t.id]) stats[t.id].d++;
  if (by >= 0 && by !== t.id && stats[by]) stats[by].k++;
  if (infOn()) {
    // a zombie comes back; a survivor who is destroyed (by a stray shot of its own) comes back as one
    if (!zed[t.id]) { zed[t.id] = 1; purgeOwned(t.id); humanGone(t.id); }
    t.respawn = C.ZED_RESPAWN;
    return;
  }
  if (respawnMode()) {
    t.respawn = C.RESPAWN_TIME + (settings.game === 'base' ? roundT * C.RESPAWN_GROW : 0);
    if (settings.game === 'dm' && state === 'play') {
      // a kill is a point; destroying yourself (or being crushed) costs one
      if (by >= 0 && by !== t.id) scores[by]++; else scores[t.id] = Math.max(0, scores[t.id] - 1);
      if (scores.some(n => n >= target())) { state = 'ending'; stateT = 0; }
    }
    return;
  }
  if (state === 'play' && roundOver()) { state = 'ending'; stateT = 0; }
}

/* ---------- infection ---------- */
// a tank that changes sides takes nothing of its own along: its shots, missiles and mines go
// (the lists are cleared at the end of the physics step, as this can happen while they are being walked)
let purgeIds = [];
function purgeOwned(id) {
  const t = tanks[id];
  purgeIds.push(id);
  if (t) { t.guided = null; t.power = null; t.charge = 0; t.laserPath = null; t.shield = 0; }
}
function purgeNow() {
  if (!purgeIds.length) return;
  const ids = new Set(purgeIds); purgeIds = [];
  bullets = bullets.filter(b => !ids.has(b.owner));
  missiles = missiles.filter(m => !ids.has(m.owner));
  mines = mines.filter(m => !ids.has(m.owner));
}
// a zombie touched a survivor: it turns where it stands, and waits a moment before it can move
function infect(t, by) {
  if (zed[t.id] || !t.alive) return;
  if (state === 'play' || state === 'ending') noteKill(t.id, by, true);
  zed[t.id] = 1; purgeOwned(t.id);
  t.hp = C.ZED_HP; t.stun = C.ZED_TURN; t.inv = 0; t.reveal = 0; t.dash = 0; t.dcool = C.DASH_COOL * 0.5; t.ai = null;
  if (stats[t.id]) stats[t.id].d++;
  if (by >= 0 && stats[by]) stats[by].k++;
  rings.push({ x: t.x, y: t.y, r: 0.9, life: 0.45, max: 0.45, col: COL.zombie });
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, s = 0.8 + Math.random() * 2.5, life = 0.3 + Math.random() * 0.4;
    particles.push({ x: t.x, y: t.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, col: i % 2 ? COL.zombie : basePen(t.id), size: 0.04 + Math.random() * 0.04 });
  }
  shake = Math.max(shake, 0.2); sfx.crack(); sfx.boom();
  netEv('infect', t.id, r2(t.x), r2(t.y));
  humanGone(t.id);
}
// a survivor is gone: once nobody is left, the round ends (the last one caught scores)
function humanGone(id) {
  if (tanks.some(o => !o.gone && !zed[o.id])) return;
  lastHuman = id;
  if (state === 'play') { state = 'ending'; stateT = 0; }
}
// how fast a tank drives: zombies are quicker, and quicker still in a dash; a stunned one stands
function driveSpeed(t) {
  if (t.stun > 0) return 0;
  return C.TANK_SPEED * (isZed(t.id) ? C.ZED_SPEED * (t.dash > 0 ? C.DASH_SPEED : 1) : 1);
}

let lastBounceSound = 0;
function bounceFx(b) {
  for (let i = 0; i < 3; i++) {
    const a = Math.random() * Math.PI * 2, s = 0.4 + Math.random() * 1.2;
    particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.2, max: 0.2, col: COL.graphite, size: 0.03 });
  }
  const now = performance.now();
  if (now - lastBounceSound > 45) { lastBounceSound = now; sfx.bounce(); netEv('bounce', r2(b.x), r2(b.y)); }
}

// Pickups appear as a mirrored pair of the same kind, so neither side is favoured.
function spawnPickups() {
  if (!puBag.length) { puBag = POWER_TYPES.slice(); for (let i = puBag.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [puBag[i], puBag[j]] = [puBag[j], puBag[i]]; } }
  const far = q => tanks.every(t => !t.alive || Math.hypot(t.x - q.x, t.y - q.y) > 2) && pickups.every(k => Math.hypot(k.x - q.x, k.y - q.y) > 1.2);
  for (let tries = 0; tries < 80; tries++) {
    const c = (Math.random() * COLS) | 0, r = (Math.random() * ROWS) | 0;
    if (walls[r][c] || water[r * COLS + c]) continue;
    if (sdOn() && ringOf(c, r) <= sdClosed) continue;     // not in a ring that is closed or about to close
    const a = { x: c + 0.5, y: r + 0.5 }, b = { x: COLS - c - 0.5, y: ROWS - r - 0.5 };
    if (!far(a) || !far(b)) continue;
    const type = puBag.pop();
    pickups.push({ x: a.x, y: a.y, type, age: 0 });
    if (a.x !== b.x || a.y !== b.y) pickups.push({ x: b.x, y: b.y, type, age: 0 });
    sfx.spawn();
    netEv('sfx', 'spawn');
    return true;
  }
  return false;
}

/* ---------- sudden death: the arena closes in, one ring of cells at a time ---------- */
const ringOf = (c, r) => Math.min(c, r, COLS - 1 - c, ROWS - 1 - r);     // 0 = outer edge
const ringCount = () => Math.ceil(Math.min(COLS, ROWS) / 2);
const sdOn = () => C.SUDDEN_DEATH_TIME > 0 && !respawnMode() && !infOn() && roundT >= C.SUDDEN_DEATH_TIME;
function closeRing(k) {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (ringOf(c, r) === k && !walls[r][c]) { walls[r][c] = true; crushed[r * COLS + c] = 1; water[r * COLS + c] = grass[r * COLS + c] = 0; }
  }
  const inWall = o => { const c = Math.floor(o.x), r = Math.floor(o.y); return c < 0 || r < 0 || c >= COLS || r >= ROWS || walls[r][c]; };
  for (let i = bullets.length - 1; i >= 0; i--) if (!bullets[i].pierce && circleHitsWall(bullets[i].x, bullets[i].y, C.BULLET_R)) bullets.splice(i, 1);
  for (let i = missiles.length - 1; i >= 0; i--) if (inWall(missiles[i])) removeMissile(i);
  for (let i = pickups.length - 1; i >= 0; i--) if (inWall(pickups[i])) pickups.splice(i, 1);
  for (let i = mines.length - 1; i >= 0; i--) if (inWall(mines[i])) mines.splice(i, 1);
  buildStatic();
  shake = Math.max(shake, 0.2);
  sfx.slam();
  // a tank caught inside a closing cell is crushed; one that only overlaps it is pushed inward at once,
  // before it can move: a centre that slips inside a wall cell could no longer be pushed out
  for (const t of tanks) if (t.alive && inWall(t)) kill(t);
  for (const t of tanks) if (t.alive) resolveCircle(t, C.TANK_R, true);
  for (const m of missiles) resolveCircle(m, C.MISSILE_R);
}

/* ---------- input ---------- */
const keys = new Set();
// arrow keys (set 0) or W A S D (set 1), in arena directions; null when none is held
function keyVec(set) {
  let kx, ky;
  if (set === 0) { kx = (keys.has('arrowright') ? 1 : 0) - (keys.has('arrowleft') ? 1 : 0); ky = (keys.has('arrowdown') ? 1 : 0) - (keys.has('arrowup') ? 1 : 0); }
  else { kx = (keys.has('d') ? 1 : 0) - (keys.has('a') ? 1 : 0); ky = (keys.has('s') ? 1 : 0) - (keys.has('w') ? 1 : 0); }
  if (!kx && !ky) return null;
  let x = kx, y = ky;
  if (rotated) { x = ky; y = -kx; }
  const m = Math.hypot(x, y);
  return { x: x / m, y: y / m, mag: 1 };
}
// the joystick of one side of this screen (0 near, 1 far)
function stickVec(p) {
  const pl = players[p], m = Math.hypot(pl.vx, pl.vy);
  if (pl.stickId === null || m < C.DEAD_ZONE) return IDLE;
  const s = p === 0 ? 1 : -1;   // the far player's controls are turned 180 degrees
  return { x: pl.vx / m * s, y: pl.vy / m * s, mag: Math.min(1, (m - C.DEAD_ZONE) / (0.85 - C.DEAD_ZONE)) };
}
// online, one person per device: any keys or the near stick drive this device's tank
function myInput() {
  const v = keyVec(0) || keyVec(1) || stickVec(0);
  return viewFlip && v.mag > 0 ? { x: -v.x, y: -v.y, mag: v.mag } : v;
}
function getInput(seat) {
  if (bots.has(seat)) return botInput(seat);
  if (mode === 'local') return soloMatch ? myInput() : (keyVec(seat) || stickVec(seat));
  if (seat === mySeat) return myInput();
  return remoteInput(seat);
}
function pressFire(seat) {

/* ---------- computer tanks ----------
   A computer tank works the same stick and fire button as a person: it drives round the walls to

  if (baseOn() && !(hasFoe && fd < 4)) {
    // base mode with no enemy tank close: clear minions, push buildings behind our own minions, else follow them

    if (tg) {
      if (tg.ax != null && lineClear(t.x, t.y, tg.ax, tg.ay, C.BULLET_R + 0.02) && Math.hypot(tg.ax - t.x, tg.ay - t.y) < 5) {
        const off = Math.abs(wrapAngle(Math.atan2(tg.ay - t.y, tg.ax - t.x) - t.angle));

        return unitTo(tg.ax - t.x, tg.ay - t.y, tg.key[0] !== 'o' && Math.hypot(tg.ax - t.x, tg.ay - t.y) > 3.2 ? 1 : 0.04);

// infection: a computer zombie goes for the nearest survivor it can find, and dashes at it when it is close
function zedBot(seat, t, ai) {

  let foe = null, fd = Infinity;
  for (const o of tanks) {
    if (!o.alive || o.gone || zed[o.id] || o.inv > 0) continue;
    const d = Math.hypot(o.x - t.x, o.y - t.y);
    if (d < fd && (seenBy(seat, o) || d < 2.5)) { fd = d; foe = o; }
  }

    if (!ai.roam || (ai.roam.t -= dt) <= 0 || Math.hypot(ai.roam.x - t.x, ai.roam.y - t.y) < 0.8) {
      ai.roam = null;
      const d = distField(Math.floor(t.x), Math.floor(t.y));
      for (let k = 0; k < 30 && !ai.roam; k++) { const i = (Math.random() * d.length) | 0; if (d[i] > 3) ai.roam = { x: i % COLS + 0.5, y: ((i / COLS) | 0) + 0.5, t: 5 }; }
    }

  }
  if (!goal) return IDLE;
  ai.replan -= dt;
  if (ai.replan <= 0 || !ai.wp) { ai.replan = 0.2; ai.wp = planWaypoint(t, goal, C.TANK_R + 0.04, true); }
  ai.chk -= dt;

// base mode: where a computer tank goes, and what it aims at on the way ({x, y} to drive to; ax, ay to shoot at)
function baseGoal(seat, t) {

  const mine = minions.filter(m => m.team === team);
  const targets = structs.filter(s => s.team !== team && s.hp > 0 && (s.kind === 'tower' || coreOpen(s.team)));
  targets.sort((a, b) => Math.hypot(a.x - t.x, a.y - t.y) - Math.hypot(b.x - t.x, b.y - t.y));
  for (const s of targets) {
    const f = facePoint(s, t.x, t.y);
    if (s.kind !== 'tower' || mine.some(m => Math.hypot(m.x - s.x, m.y - s.y) < C.TOWER_RANGE)) return { x: f.x, y: f.y, ax: f.x, ay: f.y, key: 's' + s.i };

  let best = null, bd = 5;
  for (const m of minions) if (m.team !== team) { const d = Math.hypot(m.x - t.x, m.y - t.y); if (d < bd) { bd = d; best = m; } }

/* ---------- physics (always called with the fixed step) ---------- */
function stepPhysics(dt, lethal, control) {
  LETHAL = lethal;
  for (const t of tanks) {
    if (!t.alive) {
      if (lethal && (respawnMode() || isZed(t.id)) && !t.gone && t.respawn > 0 && (t.respawn -= dt) <= 0) respawnTank(t);
      continue;
    }
    t.cool = Math.max(0, t.cool - dt);
    t.recoil = Math.max(0, t.recoil - dt * 8);
    t.shield = Math.max(0, t.shield - dt);
    t.reveal = Math.max(0, t.reveal - dt);
    t.inv = Math.max(0, t.inv - dt);
    t.stun = Math.max(0, t.stun - dt); t.dash = Math.max(0, t.dash - dt); t.dcool = Math.max(0, t.dcool - dt);
    if (t.reload > 0) { t.reload -= dt; if (t.reload <= 0) { t.reload = 0; t.ammo = clipSize(); sfx.reloaded(); netEv('sfx', 'reloaded', t.id); } }
    const locked = t.charge > 0 || t.guided !== null || t.stun > 0;   // charging a laser, steering a missile or stunned: the tank stands still
    if (t.charge > 0) {

    if (inp.mag > 0) {

      const diff = wrapAngle(Math.atan2(inp.y, inp.x) - t.angle);
      const maxTurn = C.TURN_RATE * (isZed(t.id) ? 1.2 : 1) * dt;
      t.angle = wrapAngle(t.angle + clamp(diff, -maxTurn, maxTurn));
      // drive forward only as far as the tank already points the right way (pivot first, then go)
      const speed = driveSpeed(t) * inp.mag * Math.max(0, Math.cos(diff));
      t.x += Math.cos(t.angle) * speed * dt;
      t.y += Math.sin(t.angle) * speed * dt;

    resolveCircle(t, C.TANK_R, true);
    if (t.fireQ > 0 && isZed(t.id)) {
      // a zombie cannot shoot: its button is a dash
      if (control && t.dcool <= 0 && t.stun <= 0) { t.dash = C.DASH_TIME; t.dcool = C.DASH_COOL; t.fireQ = 0; t.reveal = C.GRASS_REVEAL; sfx.launch(); netEv('sfx', 'launch'); }
      else t.fireQ -= dt;
    } else if (t.fireQ > 0) { if (control && fire(t)) { t.fireQ = 0; t.reveal = C.GRASS_REVEAL; t.inv = 0; } else t.fireQ -= dt; }

      for (let i = pickups.length - 1; i >= 0; i--) {

        if (Math.hypot(k.x - t.x, k.y - t.y) < C.TANK_R + 0.24) { t.power = k.type; pickups.splice(i, 1); sfx.pickup(); netEv('sfx', 'pickup', t.id); break; }

  for (let i = 0; i < tanks.length; i++) for (let j = i + 1; j < tanks.length; j++) {

    for (const h of tanks) {
      if (!h.alive || h.gone || zed[h.id] || h.inv > 0) continue;
      if (Math.hypot(h.x - z.x, h.y - z.y) > C.TANK_R * 2 + 0.07) continue;
      if (h.shield > 0) { hit(h, z.id); z.stun = 0.5; continue; }
      infect(h, z.id);

  }

    if (b.pierce) {
      // a piercing shot goes straight through walls and is gone when it leaves the arena
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < 0 || b.y < 0 || b.x > COLS || b.y > ROWS) { bullets.splice(i, 1); continue; }
      if (strike(b)) { bullets.splice(i, 1); continue; }
    } else {
      // move on each axis separately: hitting a wall while moving in x flips vx, in y flips vy
      b.x += b.vx * dt;
      if (circleHitsWall(b.x, b.y, C.BULLET_R)) { if (strike(b) || crack(b)) { bullets.splice(i, 1); continue; } b.x -= b.vx * dt; b.vx = -b.vx; b.bounces++; bounceFx(b); }
      b.y += b.vy * dt;
      if (circleHitsWall(b.x, b.y, C.BULLET_R)) { if (strike(b) || crack(b)) { bullets.splice(i, 1); continue; } b.y -= b.vy * dt; b.vy = -b.vy; b.bounces++; bounceFx(b); }
    }
    if (++b.tick % 2 === 0) { b.trail.push(b.x, b.y); if (b.trail.length > 22) b.trail.splice(0, 2); }
    if (b.age > (b.life || C.BULLET_LIFE) || b.bounces > (b.maxB ?? C.MAX_BOUNCES)) { bullets.splice(i, 1); continue; }
    // any shot sets off a mine it touches
    for (const mn of mines) {

    }
    for (const t of tanks) {
      if (!t.alive) continue;

      if (!canHurt(b.owner, t) || t.inv > 0) continue;     // shots pass through team-mates, and through a tank that has just come back

// a grass cell with its origin at (0, 0), blades upright

  const order = tanks.map(t => t.id).sort((a, b) => teamsOn() ? (teamOf[a] - teamOf[b]) || ((stats[b] || {}).k | 0) - ((stats[a] || {}).k | 0) : (scores[b] | 0) - (scores[a] | 0));
  order.forEach((i, k) => {
    const yy = y(ty + 0.58 * (k + 1)), col = penOf(i), v = stats[i] || { k: 0, d: 0, s: 0, h: 0 };
    if (i === seat) { ctx.globalAlpha = 0.1; ctx.fillStyle = col; rrect(cx - U * 5, yy - U * 0.26, U * 10, U * 0.52, U * 0.12); ctx.fill(); ctx.globalAlpha = 1; }
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx - U * 4.6, yy, U * 0.14, 0, Math.PI * 2); ctx.fill();
    label(nameOf(i) + (i === seat && names[i] && names[i] !== 'You' ? ' (you)' : ''), cx - U * 4.25, yy, U * 0.33, col, FONT_D, 1, 'left');
    const cell = (t, dx) => label(String(t), cx + U * dx, yy, U * 0.34, ink, FONT_D, 0.9);
    if (!teamsOn()) cell(scores[i] | 0, 1.0);
    cell(v.k, 2.2); cell(v.d, 3.3); cell(base ? v.b | 0 : hitRate(v), 4.4);
  });
  if (mode === 'guest' && !isLeader) label(dedicatedGame ? 'Waiting for the player who made the game…' : 'Waiting for the host…', cx, y(ty + 0.58 * (NP + 1) + 0.25), U * 0.28, ink, FONT_B, 0.8);
}

function drawOverlay(p, seat) {
  const single = !twoSided();
  const col = (seat >= 0 && penOf(seat)) || COL.graphite, cx = LW / 2, top = AY + AH / 2, h = AH / 2;
  // one person per screen: the overlay sits in the middle of the whole arena rather than in one player's half
  const mid = single ? AY + AH * 0.3 : top + h * 0.45;
  const me = tanks[seat];
  if (state === 'title') {
    const head = menuStep === 'mode' ? 'Tank Duel' : menuStep === 'who' ? `${GAME_NAME[settings.game]}: who plays?` : menuStep === 'mut' ? 'Party rules' : `${GAME_NAME[settings.game]} · ${whoShort()}`;
    const mt = menuTop();
    label(head, cx, mt + U * 0.42, U * (menuStep === 'mode' ? 0.72 : 0.56), col, FONT_D);
    label(menuHintText(false), cx, mt + U * 0.95, U * 0.27, COL.graphite, FONT_B);
    drawItems(menuItems(), col);
  } else if (state === 'countdown') {
    const n = Math.max(1, 3 - Math.floor(stateT / 0.65)), f = (stateT % 0.65) / 0.65;
    const pop = REDUCED ? 1 : 1 + 0.35 * Math.max(0, 1 - f * 3);
    label(String(n), cx, mid, U * 2.6 * pop, col, FONT_D, 0.92);
    if (mutNow) {
      label('★ ' + MUTS[mutNow].name, cx, mid - U * (single ? 1.95 : 1.75), U * 0.55, COL.graphite, FONT_D);
      label(MUTS[mutNow].text, cx, mid - U * (single ? 1.45 : 1.27), U * 0.27, COL.graphite, FONT_B, 0.9);
    }
    if (infOn() && seat >= 0) {
      label(isZed(seat) ? 'You are the ZOMBIE' : `You are ${PEN_NAMES[seat]}: survive!`, cx, mid + U * (single ? 1.6 : 1.05), U * 0.45, col, FONT_D, 0.9);
      label(isZed(seat) ? 'Touch them to turn them. FIRE dashes.' : 'Keep away from the zombie. It takes 2 shots.', cx, mid + U * (single ? 2.2 : 1.55), U * 0.3, COL.graphite, FONT_B, 0.85);
    } else if (single && seat >= 0) label(teamsOn() ? `You are on the ${TEAM_NAME[teamOf[seat] ? 1 : 0]} team` : `You are ${PEN_NAMES[seat]}`, cx, mid + U * 1.6, U * 0.45, col, FONT_D, 0.9);
    if (settings.game !== 'classic' && !infOn() && (single || mapIdx === 0))
      label(`${GAME_NAME[settings.game === 'teams' && !teamsOn() ? 'classic' : settings.game]} · ${goalText()}`, cx, mid + U * (single ? 2.2 : 1.5), U * 0.32, COL.graphite, FONT_B, 0.85);
  } else if (state === 'play' && stateT < 0.5) {
    label('GO!', cx, mid, U * 2, col, FONT_D, 1 - stateT / 0.5);
  } else if (state === 'play' && me && !me.alive && !me.gone && (respawnMode() || isZed(seat))) {
    label('Back in ' + Math.max(1, Math.ceil(me.respawn || 0)), cx, mid, U * 0.9, col, FONT_D, 0.85);
  } else if (state === 'play' && me && me.alive && isZed(seat) && me.stun > 0.25) {
    label('ZOMBIE!', cx, mid, U * 1.3, COL.zombie, FONT_D, 0.85);
  } else if (state === 'play' && sdOn() && roundT - C.SUDDEN_DEATH_TIME < 1.8) {
    const a = Math.min(1, (1.8 - (roundT - C.SUDDEN_DEATH_TIME)) / 0.4);
    label('SUDDEN DEATH', cx, single ? mid : top + h * 0.4, U * 1.05, COL.graphite, FONT_D, a);
    label('The walls close in. Get to the middle.', cx, single ? mid + U * 0.9 : top + h * 0.6, U * 0.36, COL.graphite, FONT_B, a);
  } else if (state === 'replay') {
    const yT = single ? AY + U * 0.6 : AY + AH - U * 1.2, yB = single ? AY + U * 1.15 : AY + AH - U * 0.5;
    label('REPLAY', single ? cx : cx - U * 1.6, single ? yT : yB, U * (single ? 0.55 : 0.45), COL.graphite, FONT_D, 0.9);
    label(replayText(), cx, single ? yB : yT, U * 0.32, hl && hl.k >= 0 ? basePen(hl.k) : COL.graphite, FONT_B, 0.95);
    for (const it of replayItems()) drawChip(it, false, col);
  } else if (state === 'result' && infOn()) {
    const a = Math.min(1, stateT / 0.15), caught = infWin.length > 0 && infWin.every(i => zed[i]);
    if (!infWin.length) label('ZOMBIES WIN', cx, mid, U * 1.2, COL.zombie, FONT_D, a);
    else if (seat >= 0 && infWin.includes(seat)) label(caught ? 'LAST ONE +1' : 'SURVIVED +1', cx, mid, U * 1.25, basePen(seat), FONT_D, a);
    else if (single) label(infWin.length === 1 ? `${nameOf(infWin[0]).toUpperCase()} +1` : `${infWin.length} SURVIVED`, cx, mid, U * 1.1, infWin.length === 1 ? basePen(infWin[0]) : COL.graphite, FONT_D, a);
    else label('CAUGHT', cx, mid, U * 1.4, COL.zombie, FONT_D, a);
    const sub = caught ? 'Everyone was caught: the last one scores.' : infWin.length ? 'Time is up: every survivor scores.' : '';
    if (sub) label(sub, cx, mid + U * (single ? 1.0 : 0.95), U * 0.32, COL.graphite, FONT_B, a * 0.85);
  } else if (state === 'result' && !respawnMode()) {
    const a = Math.min(1, stateT / 0.15);
    if (winner < 0) {
      label('DRAW', cx, mid, U * 1.6, COL.graphite, FONT_D, a);
      if (drawReason === 'ammo') label('Out of ammo', cx, mid + h * 0.23, U * 0.5, COL.graphite, FONT_B, a);
    }
    else if (seat >= 0 && winner === sideOf(seat)) label('POINT!', cx, mid, U * 1.8, col, FONT_D, a);
    else if (single) {
      const who = teamsOn() ? TEAM_NAME[winner ? 1 : 0] : nameOf(winner);
      label(`${who.toUpperCase()} +1`, cx, mid, U * 1.3, teamsOn() ? COL.pens[winner ? 1 : 0] : penOf(winner), FONT_D, a);
    }
    else label('HIT!', cx, mid, U * 1.6, COL.graphite, FONT_D, a);
  } else if (state === 'matchEnd') {
    drawMatchEnd(p, seat);
    if (stateT > 1.2) for (const it of endItems()) drawChip(it, it.kind === 'rematch', col);
  }
}

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (rotated) { ctx.translate(sw, 0); ctx.rotate(Math.PI / 2); }
  ctx.globalAlpha = 1;
  ctx.drawImage(st, 0, 0, LW, LH);

  let shx = 0, shy = 0;
  if (shake > 0 && !REDUCED) { shx = (Math.random() - 0.5) * shake * P * 0.5; shy = (Math.random() - 0.5) * shake * P * 0.5; }
  ctx.save();
  if (viewFlip) { ctx.translate(AX + AW + shx, AY + AH + shy); ctx.rotate(Math.PI); }
  else ctx.translate(AX + shx, AY + shy);
  // sudden death: the ring of cells about to close flashes, faster as its time runs out
  if ((state === 'play' || state === 'ending') && sdOn() && sdClosed < ringCount()) {
    const f = ((roundT - C.SUDDEN_DEATH_TIME) % C.SHRINK_INTERVAL) / C.SHRINK_INTERVAL;
    ctx.globalAlpha = REDUCED ? 0.26 : 0.1 + 0.3 * (0.5 - 0.5 * Math.cos(f * f * Math.PI * 14));
    ctx.fillStyle = COL.graphite;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (ringOf(c, r) === sdClosed && !walls[r][c]) ctx.fillRect(c * P, r * P, P, P);
    ctx.globalAlpha = 1;
  }
  const matchOn = state !== 'title' && !NET_SCREENS.includes(state);
  const rsv = state === 'replay' && rp && rec.frames.length ? enterReplayWorld() : null;
  if (settings.game === 'hill' && matchOn) {
    // the hill: tinted in the colour of the tank holding it; grey and blinking while it is fought over
    const hx = COLS / 2 * P, hy = ROWS / 2 * P, hr = C.HILL_R * P, held = hillHolder >= 0;
    const hc = held ? penOf(hillHolder) : COL.graphite;
    const blink = hillHolder === -2 && !REDUCED && Math.floor(performance.now() / 180) % 2 === 0;
    ctx.beginPath(); ctx.arc(hx, hy, hr, 0, Math.PI * 2);
    ctx.fillStyle = hc; ctx.globalAlpha = held ? 0.16 : blink ? 0.12 : 0.05; ctx.fill();
    ctx.strokeStyle = hc; ctx.globalAlpha = held ? 0.9 : 0.5; ctx.lineWidth = Math.max(2, P * 0.06);
    ctx.setLineDash([P * 0.26, P * 0.18]); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
  for (const m of marks) drawMark(m);
  if (structs.length && matchOn) drawBase();
  for (const k of pickups) drawPickup(k);
  for (const mn of mines) drawMine(mn);
  if (rsv) drawShotPath();

  // laser charge-up: the line the beam will take, bounces included
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const t of tanks) {
    if (!t.alive || t.charge <= 0 || !t.laserPath) continue;
    const k = 1 - t.charge / C.LASER_CHARGE;
    ctx.strokeStyle = penOf(t.id); ctx.lineWidth = P * (0.025 + 0.05 * k);
    ctx.globalAlpha = 0.3 + 0.5 * k; ctx.setLineDash([P * 0.16, P * 0.12]);
    drawPath(t.laserPath); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }

  // bullet trails (pen colour of the shooter) and bullets (ink dots)
  for (const b of bullets) {
    const life = b.life || C.BULLET_LIFE, fw = Math.min(0.6, life * 0.3);
    const fade = b.age > life - fw ? Math.max(0.15, (life - b.age) / fw) : 1;
    const tr = b.trail, n = tr.length / 2;
    ctx.strokeStyle = b.pen || penOf(b.owner); ctx.lineWidth = C.BULLET_R * P * 1.1;
    for (let i = 1; i < n; i++) {
      ctx.globalAlpha = 0.55 * (i / n) * fade;
      ctx.beginPath(); ctx.moveTo(tr[i * 2 - 2] * P, tr[i * 2 - 1] * P); ctx.lineTo(tr[i * 2] * P, tr[i * 2 + 1] * P); ctx.stroke();
    }
    ctx.globalAlpha = fade; ctx.fillStyle = COL.graphite;
    ctx.beginPath(); ctx.arc(b.x * P, b.y * P, Math.max(2.5, C.BULLET_R * P), 0, Math.PI * 2); ctx.fill();
    if (b.pierce) {                                      // a piercing shot wears a ring, so it reads as different from a bullet
      ctx.strokeStyle = b.pen || penOf(b.owner); ctx.lineWidth = Math.max(1.5, P * 0.04);
      ctx.beginPath(); ctx.arc(b.x * P, b.y * P, C.BULLET_R * P * 2.2, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // a ring marks the tank a homing missile is hunting
  const eye = viewer();
  for (const m of missiles) {
    const tg = tanks[m.target];
    if (m.type !== 'homing' || !tg || !tg.alive || tg.id === m.owner || !seenBy(eye, tg)) continue;
    const pulse = REDUCED ? 0 : 0.05 * Math.sin(m.age * 10);
    ctx.strokeStyle = penOf(m.owner); ctx.lineWidth = Math.max(1.5, P * 0.04); ctx.globalAlpha = 0.8;
    ctx.setLineDash([P * 0.14, P * 0.1]); ctx.beginPath(); ctx.arc(tg.x * P, tg.y * P, P * (0.5 + pulse), 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }
  if (!NET_SCREENS.includes(state)) for (const t of tanks) if (t.alive && seenBy(eye, t)) { drawTank(t); if (settings.terrain && !replayView) grassOver(t); }
  if (state === 'countdown' && !twoSided() && tanks[mySeat]) {
    // which tank is mine: a ring closes in on it while the round counts down
    const t = tanks[mySeat], k = REDUCED ? 0.5 : (stateT % 0.65) / 0.65;
    ctx.strokeStyle = penOf(mySeat); ctx.lineWidth = Math.max(2, P * 0.06); ctx.globalAlpha = 0.85 - 0.5 * k;
    ctx.beginPath(); ctx.arc(t.x * P, t.y * P, P * (1.25 - 0.6 * k), 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
  }
  for (const m of missiles) drawMissile(m);
  if (shells.length) drawShells();

  for (const b of beams) {
    const k = b.life / b.max;
    ctx.globalAlpha = k; ctx.strokeStyle = b.pen || penOf(b.owner); ctx.lineWidth = P * 0.18 * (0.5 + 0.5 * k); drawPath(b.path);
    ctx.strokeStyle = COL.paper; ctx.lineWidth = P * 0.05; drawPath(b.path);
  }
  for (const r of rings) {
    const k = r.life / r.max;
    ctx.globalAlpha = k * 0.9; ctx.strokeStyle = r.col; ctx.lineWidth = Math.max(2, P * 0.07);
    ctx.beginPath(); ctx.arc(r.x * P, r.y * P, r.r * P * (1 - 0.6 * k), 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = k * 0.15; ctx.fillStyle = r.col; ctx.fill();
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x * P, p.y * P, Math.max(1, p.size * P), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (rsv) leaveReplayWorld(rsv);
  ctx.restore();
  if (state === 'replay') {
    // a replay: a dashed frame round the arena, and a bar showing how far through it is
    ctx.strokeStyle = COL.graphite; ctx.lineWidth = Math.max(2, U * 0.06); ctx.globalAlpha = 0.7;
    ctx.setLineDash([U * 0.3, U * 0.2]); ctx.strokeRect(AX + 3, AY + 3, AW - 6, AH - 6); ctx.setLineDash([]);
    if (rp) { ctx.globalAlpha = 0.5; ctx.fillStyle = COL.graphite; ctx.fillRect(AX + 3, AY + 3, (AW - 6) * clamp(rpT / rp.dur, 0, 1), Math.max(3, U * 0.07)); }
    ctx.globalAlpha = 1;
  }

  const menuish = state === 'title' || NET_SCREENS.includes(state), wide = !!lobbyFrames();
  if (wide) { ctx.globalAlpha = 0.93; ctx.fillStyle = COL.paper; ctx.fillRect(0, 0, LW, LH); ctx.globalAlpha = 1; }
  else if (menuish || state === 'matchEnd') {
    ctx.globalAlpha = menuish ? 0.9 : 0.72; ctx.fillStyle = COL.paper;
    ctx.fillRect(AX + 2, AY + 2, AW - 4, AH - 4); ctx.globalAlpha = 1;
  }
  if (twoSided()) {
    for (let p = 0; p < 2; p++) forPlayer(p, () => { drawStrip(p, p); drawOverlay(p, p); });
  } else {
    // one person per device: their controls along the bottom, everyone's scores along the top
    drawStrip(0, mySeat);
    if (!wide) drawTopBoard();
    if (NET_SCREENS.includes(state)) drawNetScreen(); else drawOverlay(0, mySeat);
  }
}

/* ---------- main loop: fixed time step ---------- */
let last = 0, acc = 0;
function frame(now) {
  if (wantKey() !== layoutKey) resize();
  if (!last) last = now;
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= C.STEP) { update(C.STEP); acc -= C.STEP; }
  if (!HEADLESS) render();
  requestAnimationFrame(frame);
}

/* ---------- touch: every finger is tracked by its pointerId ---------- */
function setStick(pl, f) {
  let dx = f.x - pl.ox, dy = f.y - pl.oy;
  const m = Math.hypot(dx, dy);
  if (m > JR) {            // the base follows a thumb that drifts too far
    pl.ox += dx / m * (m - JR); pl.oy += dy / m * (m - JR);
    dx = dx / m * JR; dy = dy / m * JR;
  }
  pl.vx = dx / JR; pl.vy = dy / JR;
}
function setMuted(v) { muted = v; try { localStorage.setItem('tankduel-muted', v ? '1' : '0'); } catch (e) {} }

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioInit();
  const q = toLogical(e);
  if (nameOpen) { closeName(true); return; }
  const oneScreen = twoSided();
  const p = !oneScreen || q.y > LH / 2 ? 0 : 1;   // which half of the screen = which player (online: one person per screen)
  const f = toPlayerFrame(p, q.x, q.y);
  const inMatch = state !== 'title';
  const sp = switchSpots(), near = (o, w) => o && Math.abs(f.x - o.x) < w && Math.abs(f.y - o.y) < 20;
  if (NET_SCREENS.includes(state)) {
    if (near(sp.sound, 46)) { setMuted(!muted); return; }
    const it = hitItem(netItems(), f); if (it) applyMenu(it);
    return;
  }
  // the small switches at the edge
  if (near(sp.sound, 46)) { setMuted(!muted); return; }
  if (near(sp.quit, 60)) {
    if (quitArm > 0 && performance.now() - quitArm < 2500) goMenu(); else quitArm = performance.now();
    return;
  }
  if (state === 'title') { const it = hitItem(menuItems(), f); if (it) applyMenu(it); return; }
  if (state === 'matchEnd') { if (stateT > 1.2) { const it = hitItem(endItems(), f); if (it) applyMenu(it); } return; }
  if (state === 'replay') { if (hitItem(replayItems(), f)) { sfx.tick(); skipReplay(); } return; }
  const pl = players[p];
  if (f.x < LW / 2) {
    if (pl.stickId !== null) return;
    pl.stickId = e.pointerId;
    pl.ox = clamp(f.x, JR * 0.6, LW / 2 - JR * 0.3);
    pl.oy = land ? clamp(f.y, JR * 0.6, LH - JR * 0.6) : clamp(f.y, LH - S + JR * 0.5, LH - JR * 0.5);
    setStick(pl, f);
  } else {
    pl.fireId = e.pointerId;
    pressFireFrom(p);
  }
});
canvas.addEventListener('pointermove', e => {
  for (const pl of players) {
    if (pl.stickId !== e.pointerId) continue;
    e.preventDefault();
    const q = toLogical(e);
    setStick(pl, toPlayerFrame(pl.id, q.x, q.y));
  }
});
function release(e) {
  for (const pl of players) {
    if (pl.stickId === e.pointerId) { pl.stickId = null; pl.vx = 0; pl.vy = 0; }
    if (pl.fireId === e.pointerId) pl.fireId = null;
  }
}
canvas.addEventListener('pointerup', e => { audioInit(); release(e); });
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('lostpointercapture', release);

// stop the browser from scrolling, zooming or selecting while four thumbs are on the glass
for (const type of ['touchstart', 'touchmove', 'touchend']) {
  document.addEventListener(type, e => {
    if (type === 'touchend') audioInit();
    if (e.target && e.target.closest && e.target.closest('#namebox')) return;      // the name box takes ordinary taps
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
}
for (const type of ['gesturestart', 'gesturechange', 'contextmenu', 'dblclick', 'selectstart']) {
  document.addEventListener(type, e => { if (!(e.target && e.target.closest && e.target.closest('#namebox'))) e.preventDefault(); });
}

// keyboard, for trying it on a computer: arrows + Enter, and W A S D + Space.
// In the menu: G = game mode, C = computer tanks, 1 2 3 4 = ammo, P = power-ups, B = breakable walls, M = maps, N = match length.
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'enter'].includes(k)) e.preventDefault();
  if (e.repeat || nameOpen) return;
  audioInit();
  keys.add(k);
  if (state === 'title') {
    if (k === 'escape') { menuStep = menuStep === 'mut' ? 'rules' : menuStep === 'rules' ? 'who' : 'mode'; menuFocus = ''; return; }
    if (k === 'o') { goOnline(); return; }
    if (k === ' ' || k === 'enter') beginFromMenu();
    else if (['1', '2', '3', '4'].includes(k)) setAmmoMode(AMMO_MODES[+k - 1]);
    else if (k === 'p') { settings.powerups = !settings.powerups; saveSettings(); }
    else if (k === 'm') { settings.maps = MAP_POOLS[(MAP_POOLS.indexOf(settings.maps) + 1) % MAP_POOLS.length]; saveSettings(); }
    else if (k === 'n') { settings.winScore = WIN_SCORES[(WIN_SCORES.indexOf(settings.winScore) + 1) % WIN_SCORES.length]; saveSettings(); menuFocus = 'win'; }
    else if (k === 'g') { settings.game = nextOf(GAME_MODES, settings.game); saveSettings(); menuFocus = 'game'; }
    else if (k === 'b') { Object.assign(settings, featPatch((featIdx() + 1) % 4)); saveSettings(); menuFocus = 'soft'; }
    else if (k === 'c') { settings.cpu = (settings.cpu + 1) % 4; saveSettings(); menuFocus = 'cpu'; }
    return;
  }
  if (k === 'escape') { if (state === 'joinCode') { state = 'online'; netMsg = ''; } else if (state === 'board') closeBoard(); else goMenu(); return; }
  if (state === 'joinCode') {
    if (k === 'backspace') typeKey('del'); else if (k === 'enter') typeKey('join'); else typeKey(k);
    return;
  }
  if (state === 'online') { if (k === 'h') startHosting(); else if (k === 'j') { state = 'joinCode'; typedCode = ''; } return; }
  if (state === 'hostWait') { if (k === 'enter' || k === ' ') hostStart(); return; }
  if (state === 'guestWait' && isLeader) { if (k === 'enter' || k === ' ') sendCmd('start'); return; }
  if (NET_SCREENS.includes(state)) return;
  if (state === 'matchEnd') {
    if (stateT > 1.2 && (k === ' ' || k === 'enter')) { if (mode === 'host') hostStart(); else if (mode === 'guest') { if (isLeader) sendCmd('rematch'); } else startMatch(); }
    return;
  }
  if (state === 'replay') { if (k === 'enter' || k === 's') skipReplay(); return; }
  if (mode !== 'local' || soloMatch) { if ([' ', 'enter', 'f', 'm', '/'].includes(k)) pressFireFrom(0); return; }
  if (k === 'enter' || k === '/' || k === 'm') pressFire(0);
