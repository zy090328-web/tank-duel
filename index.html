<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Graph Paper Tank Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&amp;family=Patrick+Hand&amp;display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one full-screen canvas. Square arena in the middle of a sheet of graph paper,
     one control strip per player at the two short ends of the tablet. Single theme by choice. */
  --paper: #f5f7f3;
  --grid: #b6d0ea;
  --margin-line: #eda3ab;
  --graphite: #343941;
  --red-pen: #d32d3b;
  --blue-pen: #1c4ec2;
  --green-pen: #1b8450;
  --orange-pen: #d06a12;
  --violet-pen: #7b3ab4;
  --font-display: "Gochi Hand", "Marker Felt", "Chalkboard SE", "Comic Sans MS", cursive;
  --font-body: "Patrick Hand", "Chalkboard SE", "Comic Sans MS", cursive;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--paper); color: var(--graphite); }
body {
  position: fixed; inset: 0;
  touch-action: none; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  font-family: var(--font-body);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#namebox {
  position: fixed; z-index: 5; left: 50%; top: max(14px, env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; max-width: calc(100% - 32px); box-sizing: border-box;
  background: var(--paper); border: 2px solid var(--graphite); border-radius: 14px; box-shadow: 0 6px 0 rgba(52, 57, 65, 0.18);
  font-family: var(--font-body); font-size: 20px;
}
#namebox[hidden] { display: none; }
#namebox input {
  width: 9.5em; min-width: 0; font: inherit; color: var(--graphite); background: #fff; padding: 6px 10px;
  border: 2px solid var(--graphite); border-radius: 10px; -webkit-user-select: text; user-select: text; touch-action: manipulation;
}
#namebox input:focus-visible, #namebox button:focus-visible { outline: 3px solid var(--blue-pen); outline-offset: 2px; }
#namebox button {
  font: inherit; font-family: var(--font-display); color: var(--paper); background: var(--red-pen);
  border: 0; border-radius: 10px; padding: 7px 16px; touch-action: manipulation;
}
noscript { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; }
</style>
</head>
<body>
<canvas id="game" role="img" aria-label="Tank Duel: a two-player tank game played on one touch screen"></canvas>
<div id="namebox" hidden>
  <label for="nameinput">Your name</label>
  <input id="nameinput" type="text" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" enterkeyhint="done">
  <button id="nameok" type="button">OK</button>
</div>
<noscript>This game needs JavaScript turned on.</noscript>
<script>
(() => {
'use strict';

/* ============================================================
   TUNING. Units: cells and seconds. Change these and reload.
   ============================================================ */
const C = {
  TANK_SPEED: 2.6,       // cells per second at full stick
  TURN_RATE: 5.5,        // radians per second (limited turn speed = you must plan ahead)
  TANK_R: 0.3,           // tank collision radius (tank is treated as a circle)
  BULLET_SPEED: 6.2,     // clearly faster than the tank
  BULLET_R: 0.075,
  BULLET_LIFE: 5,        // seconds before a bullet disappears
  MAX_BOUNCES: 6,        // a bullet disappears on the bounce after this many
  FIRE_COOLDOWN: 0.3,    // seconds between shots
  SELF_SAFE_TIME: 0.2,   // your own bullet cannot hit you this soon after firing
  WIN_SCORE: 5,          // default; the menu offers first to 3, 5 or 7
  DRAW_WINDOW: 0.9,      // if the survivor also dies within this time, the round is a draw
  DEAD_ZONE: 0.22,       // joystick dead zone (fraction of its radius)
  STEP: 1 / 120,         // fixed physics time step

  // ammo modes
  MAX_BULLETS: 5,        // "Unlimited": most shots one player can have on the field at once
  CLIP_SIZE: 5,          // "5 + reload" and "5 only": shots in the magazine
  RELOAD_TIME: 3,        // "5 + reload": seconds to refill an empty magazine
  SINGLE_COOLDOWN: 5,    // "1 per 5 s": seconds to wait after every shot

  // sudden death
  SUDDEN_DEATH_TIME: 20, // seconds of play before the walls start to close in (0 = never)
  SHRINK_INTERVAL: 4,    // seconds between one ring of cells closing and the next

  // power-ups
  PICKUP_FIRST: 3.5,     // seconds into a round before the first pickups appear
  PICKUP_INTERVAL: 7,    // seconds between pickup spawns
  LASER_CHARGE: 0.6,     // charge-up: the aim line is visible and the shooter cannot move
  LASER_BOUNCES: 3,
  LASER_RANGE: 30,
  HOMING_SPEED: 2.3,     // a little slower than a tank, so it can be outrun
  HOMING_TURN: 5,
  HOMING_LIFE: 9,
  GUIDED_SPEED: 3.2,
  GUIDED_TURN: 5.5,
  GUIDED_LIFE: 6,
  GUIDED_BLAST: 0.8,     // blast radius when a guided missile goes off
  GUIDED_ARM: 0.4,       // seconds before a guided missile can be set off by its owner
  MISSILE_R: 0.13,
  MISSILE_ARM: 0.6,      // a guided missile cannot hit its own tank this soon after launch
  SHIELD_TIME: 4,        // a shield lasts this long, stops one hit, and the tank cannot fire while it is up
  SPREAD_ANGLE: 0.2,     // radians between the three shots of a spread
  SPREAD_LIFE: 1.3,      // spread shots are short-lived...
  SPREAD_BOUNCES: 1,     // ...and bounce only once
  MINE_ARM: 0.8,         // seconds before a mine can go off
  MINE_TRIGGER: 0.5,     // a tank this close (centre to centre) sets an armed mine off
  MINE_R: 0.15,
  PIERCE_SPEED: 3.4,      // a piercing shot flies through walls, slowly, and never bounces

  // game modes
  RESPAWN_TIME: 2,       // deathmatch and hill: seconds before a destroyed tank comes back
  SPAWN_SHIELD: 1.5,     // ...and how long it is shielded when it does (it cannot fire meanwhile)
  HILL_R: 1.5            // hill: radius of the circle in the middle
};

/* ============================================================
   MAPS. '#' = wall, '1' = player 1 start. Every map is made
   180-degree symmetric in code, so both sides are equal.
   A map can be any size; the first three are 11x11, the rest
   are 13x13. A match plays them in a shuffled order.
   ============================================================ */
const MAPS = [
  [ "...........",
    "...........",
    "..##...##..",
    "..#.....#..",
    "....###....",
    ".#.......#.",
    "....###....",
    "..#.....#..",
    "..##...##..",
    ".....1.....",
    "..........." ],
  [ "...........",
    "...........",
    ".###...###.",
    "...........",
    "...#.#.#...",
    ".#...#...#.",
    "...#.#.#...",
    "...........",
    ".###...###.",
    ".....1.....",
    "..........." ],
  [ "...........",
    "........#..",
    ".##.....#..",
    "....##.....",
    ".#......##.",
    ".#..###..#.",
    ".##......#.",
    ".....##....",
    "..#.....##.",
    "..#..1.....",
    "..........." ],
  // Pillars
  [ ".............",
    ".#.#.#.#.#.#.",
    ".............",
    ".#.###.###.#.",
    ".............",
    ".#.#.###.#.#.",
    ".#.........#.",
    ".#.#.###.#.#.",
    ".............",
    ".#.###.###.#.",
    ".............",
    ".#.#.#.#.#.#.",
    "......1......" ],
  // Maze
  [ ".............",
    ".###.#.###.#.",
    "...#.#.....#.",
    ".#.#.###.#.#.",
    ".#.......#...",
    ".###.#.###.#.",
    ".....#.#.....",
    ".#.###.#.###.",
    "...#.......#.",
    ".#.#.###.#.#.",
    ".#.....#.#...",
    ".#.###.#.###.",
    "......1......" ],
  // Rings
  [ ".............",
    ".............",
    "..##.######..",
    "..#.......#..",
    "..#.###.#....",
    "..#.....#.#..",
    "..#.#...#.#..",
    "..#.#.....#..",
    "....#.###.#..",
    "..#.......#..",
    "..######.##..",
    "......1......",
    "............." ],
  // Rooms
  [ "....#...#....",
    "..#.....#....",
    "....#.....#..",
    "....#...#....",
    "##.##.#####.#",
    "....#...#....",
    "......#......",
    "....#...#....",
    "#.#####.##.##",
    "....#...#....",
    "..#.....#....",
    "....#.1...#..",
    "....#...#...." ],
  // Diamond
  [ ".............",
    ".##.......##.",
    ".#.........#.",
    ".....#.#.....",
    "....#...#....",
    "...#..#..#...",
    ".....###.....",
    "...#..#..#...",
    "....#...#....",
    ".....#.#.....",
    ".#.........#.",
    ".##...1...##.",
    "............." ],
  // Circuit
  [ ".............",
    ".#####.#####.",
    ".............",
    ".#.###.###.#.",
    ".#.#.....#.#.",
    "...#.###.#...",
    ".#.#.....#.#.",
    "...#.###.#...",
    ".#.#.....#.#.",
    ".#.###.###.#.",
    ".............",
    ".#####.#####.",
    "......1......" ]
];
// Four-way maps for three to five tanks: every wall drawn here is repeated turned through 90, 180 and
// 270 degrees, so all four sides of the arena are the same. Only one quarter needs drawing.
const ROT4 = new Set();
for (const m of [
  // Crossroads
  [ ".............",
    ".#...........",
    "..##.........",
    "..#...#......",
    "......#......",
    ".............",
    ".............",
    ".............",
    ".............",
    ".............",
    ".............",
    "......1......",
    "............." ],
  // Pinwheel
  [ ".............",
    ".............",
    "....#........",
    "....#........",
    "..###........",
    ".....#.......",
    ".............",
    ".............",
    ".............",
    ".............",
    ".............",
    "......1......",
    "............." ],
  // Fort
  [ ".............",
    "...#.........",
    ".............",
    "...###.......",
    ".............",
    ".#...........",
    ".............",
    ".............",
    ".............",
    ".............",
    ".............",
    "......1......",
    "............." ]
]) { ROT4.add(MAPS.length); MAPS.push(m); }
let COLS = 11, ROWS = 11;      // size of the map being played; set by loadMap
const DIRS4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const POWER_TYPES = ['laser', 'homing', 'guided', 'shield', 'spread', 'mine', 'pierce'];
const POWER_NAME = { laser: 'LASER', homing: 'HOMING', guided: 'GUIDED', shield: 'SHIELD', spread: 'SPREAD', mine: 'MINE', pierce: 'PIERCE' };

/* ---------- helpers ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const wrapAngle = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function distToSeg(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy;
  const u = l2 > 0 ? clamp(((px - ax) * vx + (py - ay) * vy) / l2, 0, 1) : 0;
  return Math.hypot(px - (ax + vx * u), py - (ay + vy * u));
}

const css = getComputedStyle(document.documentElement);
const tok = n => css.getPropertyValue(n).trim();
const COL = {
  paper: tok('--paper'), grid: tok('--grid'), margin: tok('--margin-line'),
  graphite: tok('--graphite'),
  pens: [tok('--red-pen'), tok('--blue-pen'), tok('--green-pen'), tok('--orange-pen'), tok('--violet-pen')]
};
const PEN_NAMES = ['Red', 'Blue', 'Green', 'Orange', 'Violet'];
const MAX_PLAYERS = 5;
const FONT_D = tok('--font-display'), FONT_B = tok('--font-body');
const IS_TOUCH = (navigator.maxTouchPoints || 0) > 0 || matchMedia('(pointer: coarse)').matches;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const st = document.createElement('canvas');   // static layer: paper, grid, walls

/* ---------- settings ---------- */
const AMMO_MODES = ['unlimited', 'reload', 'limited', 'single'];
const MAP_POOLS = ['all', 'classic', 'complex'], WIN_SCORES = [3, 5, 7];
// classic: last tank standing takes the round. teams: the same, two sides. dm: destroyed tanks come back
// and kills are counted. hill: tanks come back, and holding the circle in the middle scores.
const GAME_MODES = ['classic', 'teams', 'dm', 'hill'];
const GAME_NAME = { classic: 'Classic', teams: 'Teams', dm: 'Deathmatch', hill: 'Hill' };
const GAME_TEXT = {
  classic: 'Last tank standing wins the round.',
  teams: 'Two teams; your side cannot hit you. Needs 3 or more tanks.',
  dm: 'Destroyed tanks come back. Every kill is a point.',
  hill: 'Stand alone in the circle in the middle to score.'
};
const KILL_GOAL = { 3: 5, 5: 10, 7: 15 }, HILL_GOAL = { 3: 20, 5: 30, 7: 45 };
// soft: some walls break when shot. cpu: on one screen, play alone against this many computer tanks (0 = two people).
let settings = { ammo: 'unlimited', powerups: false, maps: 'all', winScore: C.WIN_SCORE, game: 'classic', soft: false, cpu: 0 };
function validSettings(s) {
  if (!s || !AMMO_MODES.includes(s.ammo)) return null;
  return { ammo: s.ammo, powerups: !!s.powerups, maps: MAP_POOLS.includes(s.maps) ? s.maps : 'all',
    winScore: WIN_SCORES.includes(s.winScore) ? s.winScore : C.WIN_SCORE,
    game: GAME_MODES.includes(s.game) ? s.game : 'classic', soft: !!s.soft, cpu: [1, 2, 3].includes(s.cpu) ? s.cpu : 0 };
}
// classic = the small 11x11 maps, complex = the 13x13 ones
function mapPool() {
  const all = MAPS.map((_, i) => i);
  if (NP >= 4 || teamsOn()) return all.filter(i => MAPS[i].length > 11);   // four or five tanks, or teams, need the bigger maps
  if (NP === 3 && settings.maps !== 'classic') return all.filter(i => MAPS[i].length > 11);
  if (settings.maps === 'classic') return all.filter(i => MAPS[i].length <= 11);
  if (settings.maps === 'complex') return all.filter(i => MAPS[i].length > 11);
  return all;
}
// "1 per 5 s" is a magazine of one with a long refill; "5 + reload" is a magazine of five with a short one
const clipSize = () => settings.ammo === 'single' ? 1 : C.CLIP_SIZE;
const reloadTime = () => settings.ammo === 'single' ? C.SINGLE_COOLDOWN : C.RELOAD_TIME;
const refills = () => settings.ammo === 'reload' || settings.ammo === 'single';
try { settings = validSettings(JSON.parse(localStorage.getItem('tankduel-settings') || 'null')) || settings; } catch (e) {}
function saveSettings() { try { localStorage.setItem('tankduel-settings', JSON.stringify(settings)); } catch (e) {} }
let muted = false;
try { muted = localStorage.getItem('tankduel-muted') === '1'; } catch (e) {}
let myName = '', nameOpen = false, nameSentAt = 0;
try { myName = String(localStorage.getItem('tankduel-name') || '').replace(/[<>]/g, '').trim().slice(0, 12); } catch (e) {}
const nameBox = document.getElementById('namebox'), nameInput = document.getElementById('nameinput'), nameOk = document.getElementById('nameok');
function openName() {
  if (!nameBox || !nameInput || typeof nameInput.focus !== 'function') return;
  nameOpen = true; nameBox.hidden = false; nameInput.value = myName;
  try { nameInput.focus(); nameInput.select(); } catch (e) {}
}
function closeName(save) {
  if (!nameOpen) return;
  nameOpen = false; nameBox.hidden = true;
  try { nameInput.blur(); } catch (e) {}
  if (!save) return;
  myName = cleanName(nameInput.value);
  try { localStorage.setItem('tankduel-name', myName); } catch (e) {}
  if (mode === 'guest') toHost({ n: myName });
}
if (nameOk && nameInput && nameOk.addEventListener) {
  nameOk.addEventListener('click', () => closeName(true));
  nameInput.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') closeName(true); else if (e.key === 'Escape') closeName(false); });
  nameInput.addEventListener('keyup', e => e.stopPropagation());
}

/* ---------- game state ---------- */
let walls = [], spawn = [{ x: 0, y: 0 }, { x: 0, y: 0 }];
let crushed = new Uint8Array(0);             // cells shut by sudden death (drawn cross-hatched)
let mapIdx = 0;                              // round counter within the match
let mapId = 0;                               // which map is loaded
let mapOrder = MAPS.map((_, i) => i), lastFirstMap = -1;
let state = 'title';      // title (menu) -> countdown -> play -> ending -> result -> (countdown | matchEnd)
let stateT = 0;
let scores = [0, 0];
let winner = -1;          // winner of the last round, -1 = draw
let drawReason = '';      // 'ammo' when a "5 only" round ends with both magazines empty
let resumeMatch = false;
let lastCount = 0;
let roundId = 0;          // counts rounds, so guests can tell a new round on the same map
let netEvents = [];       // host: recent things that happened, for guests to replay as sound and sparks
let netSeq = 0;
let entId = 0;            // ids for bullets, missiles and mines, so guests can follow each one between snapshots
let shake = 0;
let emptyT = 0;
let roundT = 0, sdClosed = 0, sdStarted = false;   // play time this round; sudden-death rings closed so far
let pickupTimer = 0, puBag = [];
let quitArm = 0;
let LETHAL = false;
let teamOf = [];            // team (0 red, 1 blue) of each tank in a team match
let names = [];             // what each tank's player is called
let bots = new Set();       // tanks driven by the computer
let soloMatch = false;      // one person on this screen against computer tanks
let stats = [];             // per tank, this match: kills, deaths, shots, hits
let soft = new Uint8Array(0), broken = [];     // breakable wall cells; the ones broken this round, in order
let hillHolder = -1, hillT = [];               // hill: who holds the circle (-1 nobody, -2 contested); seconds held per tank
const respawnMode = () => settings.game === 'dm' || settings.game === 'hill';
const teamsOn = () => settings.game === 'teams' && NP > 2;
const target = () => settings.game === 'dm' ? KILL_GOAL[settings.winScore] : settings.game === 'hill' ? HILL_GOAL[settings.winScore] : settings.winScore;
const goalText = () => settings.game === 'dm' ? `first to ${target()} kills` : settings.game === 'hill' ? `hold it for ${target()} s` : `first to ${target()}`;
const penOf = i => teamsOn() ? COL.pens[teamOf[i] ? 1 : 0] : (COL.pens[i] || COL.graphite);
const sideOf = i => teamsOn() ? (teamOf[i] ? 1 : 0) : i;          // what scores[] is counted by: team or tank
const canHurt = (owner, t) => owner === t.id || !teamsOn() || teamOf[owner] !== teamOf[t.id];
const champion = () => { let b = 0; scores.forEach((v, i) => { if (v > scores[b]) b = i; }); return b; };
const cleanName = v => String(v == null ? '' : v).replace(/[\u0000-\u001f<>]/g, '').trim().slice(0, 12);
const nameOf = i => names[i] || (bots.has(i) ? 'CPU' : teamsOn() ? 'Player ' + (i + 1) : PEN_NAMES[i]);

// mode: 'local' = two players on one screen; 'host' = this device runs the game for players on other devices;
// 'guest' = this device drives one tank of a game hosted elsewhere and draws what the host sends
let mode = 'local';
let NP = 2;                // tanks in the current match (2 on one screen, 2-5 online)
let mySeat = 0;            // which tank this device drives online (-1 = watching)
let viewFlip = false;      // online: the arena is turned 180 degrees so this device's tank starts at the bottom
const makeTank = id => ({ id, x: 0, y: 0, angle: 0, alive: true, cool: 0, recoil: 0, ammo: C.CLIP_SIZE, reload: 0, power: null, charge: 0, laserPath: null, guided: null, shield: 0, fireQ: 0, gone: false, respawn: 0, ai: null });
let tanks = [0, 1].map(makeTank);
function setTankCount(n) { NP = n; tanks = Array.from({ length: n }, (_, i) => makeTank(i)); }
let bullets = [], missiles = [], mines = [], pickups = [], beams = [], rings = [], particles = [], marks = [];
// the two control strips of this screen (index = screen side: 0 near, 1 far)
const players = [0, 1].map(id => ({ id, stickId: null, ox: 0, oy: 0, vx: 0, vy: 0, fireId: null }));
const IDLE = { x: 0, y: 0, mag: 0 };

/* ---------- map ---------- */
function loadMap(i) {
  mapId = ((i % MAPS.length) + MAPS.length) % MAPS.length;
  const m = MAPS[mapId];
  ROWS = m.length; COLS = m[0].length;
  crushed = new Uint8Array(COLS * ROWS); soft = new Uint8Array(COLS * ROWS); broken = [];
  const rot4 = ROT4.has(mapId), N = ROWS - 1, M = COLS - 1;
  const mark = (r, c) => m[r][c] === '#';
  walls = [];
  for (let r = 0; r < ROWS; r++) {
    walls.push([]);
    for (let c = 0; c < COLS; c++) {
      // a cell is a wall if it, or a cell that turns onto it (180 degrees; on four-way maps also 90 and 270), is marked '#'
      walls[r].push(mark(r, c) || mark(N - r, M - c) || (rot4 && (mark(c, N - r) || mark(N - c, r))));
    }
  }
  let sc = COLS >> 1, sr = ROWS - 2;
  for (let r = 0; r < ROWS; r++) { const c = m[r].indexOf('1'); if (c >= 0) { sc = c; sr = r; } }
  const two = [[sr, sc], [N - sr, M - sc]];
  const four = [[sr, sc], [sc, N - sr], [N - sr, M - sc], [N - sc, sr]];      // going round: bottom, left, top, right
  for (const [r, c] of rot4 ? four : two) walls[r][c] = false;
  if (settings.game === 'hill') carveHill(sc, sr);
  if (settings.soft) markSoft(rot4);
  const at = ([r, c]) => ({ x: c + 0.5, y: r + 0.5 });
  if (teamsOn()) spawn = teamSpawns(sc, sr);
  else if (NP <= 2) spawn = two.map(at);
  else if (rot4 && NP === 4) spawn = four.map(at);
  else spawn = spreadSpawns(NP, sc, sr);
}

// Hill: the circle in the middle is cleared of walls, and a way in is opened if the map had none.
function carveHill(sc, sr) {
  const cx = COLS / 2, cy = ROWS / 2, mc = COLS >> 1, mr = ROWS >> 1;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (Math.hypot(c + 0.5 - cx, r + 0.5 - cy) < C.HILL_R + 0.2) walls[r][c] = false;
  for (let k = 2; k < Math.min(mc, mr) && distField(sc, sr)[mr * COLS + mc] < 0; k++) {
    walls[mr][mc - k] = walls[mr][mc + k] = walls[mr - k][mc] = walls[mr + k][mc] = false;
  }
}
// Breakable walls: about four in ten wall cells, chosen the same way on every device and the same on every side of the map.
function markSoft(rot4) {
  const N = ROWS - 1, M = COLS - 1;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!walls[r][c]) continue;

    const d = Math.hypot(o.x - x, o.y - y);
    if (d < bd) { bd = d; best = o.id; }
  }
  return best;
}

function removeMissile(i) {
  const m = missiles[i];
  missiles.splice(i, 1);
  const o = tanks[m.owner];
  if (o.guided === m) { o.guided = null; o.cool = C.FIRE_COOLDOWN; }
}
function puff(x, y, owner) {
  const col = penOf(owner);
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2, s = 0.5 + Math.random() * 1.8;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.3, max: 0.3, col: i % 2 ? col : COL.graphite, size: 0.04 });
  }
  sfx.pop();
  netEv('puff', r2(x), r2(y), owner);
}
function blast(m) {
  rings.push({ x: m.x, y: m.y, r: C.GUIDED_BLAST, life: 0.4, max: 0.4, col: penOf(m.owner) });
  for (let i = 0; i < 22; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 4, life = 0.25 + Math.random() * 0.4;
    particles.push({ x: m.x, y: m.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, col: i % 3 ? penOf(m.owner) : COL.graphite, size: 0.04 + Math.random() * 0.05 });
  }
  shake = Math.max(shake, 0.25);
  sfx.boom();
  netEv('blast', r2(m.x), r2(m.y), m.owner);
  for (const mn of mines) if (Math.hypot(mn.x - m.x, mn.y - m.y) < C.GUIDED_BLAST) mn.boom = true;     // a blast sets off mines inside it
  if (settings.soft) {                                                                                   // ...and knocks down breakable walls
    for (let i = 0; i < soft.length; i++) if (soft[i] && Math.hypot(i % COLS + 0.5 - m.x, ((i / COLS) | 0) + 0.5 - m.y) < C.GUIDED_BLAST + 0.35) breakWall(i);
  }
  if (!LETHAL) return;
  for (const t of tanks) if (t.alive && canHurt(m.owner, t) && Math.hypot(t.x - m.x, t.y - m.y) < C.GUIDED_BLAST) hit(t, m.owner);
}

function kill(t, by = -1) {
  t.alive = false; t.charge = 0;
  const seed = (Math.random() * 1e9) | 0;
  marks.push({ x: t.x, y: t.y, col: penOf(t.id), seed });
  netEv('kill', t.id, r2(t.x), r2(t.y), seed);
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 4.5, life = 0.35 + Math.random() * 0.6;
    particles.push({ x: t.x, y: t.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, col: i % 3 ? penOf(t.id) : COL.graphite, size: 0.04 + Math.random() * 0.06 });
  }
  shake = 0.35;
  sfx.boom();
  if (stats[t.id]) stats[t.id].d++;
  if (by >= 0 && by !== t.id && stats[by]) stats[by].k++;
  if (respawnMode()) {
    t.respawn = C.RESPAWN_TIME;
    if (settings.game === 'dm' && state === 'play') {
      // a kill is a point; destroying yourself (or being crushed) costs one
      if (by >= 0 && by !== t.id) scores[by]++; else scores[t.id] = Math.max(0, scores[t.id] - 1);
      if (scores.some(n => n >= target())) { state = 'ending'; stateT = 0; }
    }
    return;
  }
  if (state === 'play' && roundOver()) { state = 'ending'; stateT = 0; }
}

let lastBounceSound = 0;
function bounceFx(b) {
  for (let i = 0; i < 3; i++) {
    const a = Math.random() * Math.PI * 2, s = 0.4 + Math.random() * 1.2;
    particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.2, max: 0.2, col: COL.graphite, size: 0.03 });
  }
  const now = performance.now();
  if (now - lastBounceSound > 45) { lastBounceSound = now; sfx.bounce(); netEv('bounce', r2(b.x), r2(b.y)); }
}

// Pickups appear as a mirrored pair of the same kind, so neither side is favoured.
function spawnPickups() {
  if (!puBag.length) { puBag = POWER_TYPES.slice(); for (let i = puBag.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [puBag[i], puBag[j]] = [puBag[j], puBag[i]]; } }
  const far = q => tanks.every(t => !t.alive || Math.hypot(t.x - q.x, t.y - q.y) > 2) && pickups.every(k => Math.hypot(k.x - q.x, k.y - q.y) > 1.2);
  for (let tries = 0; tries < 80; tries++) {
    const c = (Math.random() * COLS) | 0, r = (Math.random() * ROWS) | 0;
    if (walls[r][c]) continue;
    if (sdOn() && ringOf(c, r) <= sdClosed) continue;     // not in a ring that is closed or about to close
    const a = { x: c + 0.5, y: r + 0.5 }, b = { x: COLS - c - 0.5, y: ROWS - r - 0.5 };
    if (!far(a) || !far(b)) continue;
    const type = puBag.pop();
    pickups.push({ x: a.x, y: a.y, type, age: 0 });
    if (a.x !== b.x || a.y !== b.y) pickups.push({ x: b.x, y: b.y, type, age: 0 });
    sfx.spawn();
    netEv('sfx', 'spawn');
    return true;
  }
  return false;
}

/* ---------- sudden death: the arena closes in, one ring of cells at a time ---------- */
const ringOf = (c, r) => Math.min(c, r, COLS - 1 - c, ROWS - 1 - r);     // 0 = outer edge
const ringCount = () => Math.ceil(Math.min(COLS, ROWS) / 2);
const sdOn = () => C.SUDDEN_DEATH_TIME > 0 && !respawnMode() && roundT >= C.SUDDEN_DEATH_TIME;
function closeRing(k) {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (ringOf(c, r) === k && !walls[r][c]) { walls[r][c] = true; crushed[r * COLS + c] = 1; }
  }
  const inWall = o => { const c = Math.floor(o.x), r = Math.floor(o.y); return c < 0 || r < 0 || c >= COLS || r >= ROWS || walls[r][c]; };
  for (let i = bullets.length - 1; i >= 0; i--) if (!bullets[i].pierce && circleHitsWall(bullets[i].x, bullets[i].y, C.BULLET_R)) bullets.splice(i, 1);
  for (let i = missiles.length - 1; i >= 0; i--) if (inWall(missiles[i])) removeMissile(i);
  for (let i = pickups.length - 1; i >= 0; i--) if (inWall(pickups[i])) pickups.splice(i, 1);
  for (let i = mines.length - 1; i >= 0; i--) if (inWall(mines[i])) mines.splice(i, 1);
  buildStatic();
  shake = Math.max(shake, 0.2);
  sfx.slam();
  // a tank caught inside a closing cell is crushed; one that only overlaps it is pushed inward at once,
  // before it can move: a centre that slips inside a wall cell could no longer be pushed out
  for (const t of tanks) if (t.alive && inWall(t)) kill(t);
  for (const t of tanks) if (t.alive) resolveCircle(t, C.TANK_R);
  for (const m of missiles) resolveCircle(m, C.MISSILE_R);
}

/* ---------- input ---------- */
const keys = new Set();
// arrow keys (set 0) or W A S D (set 1), in arena directions; null when none is held
function keyVec(set) {
  let kx, ky;
  if (set === 0) { kx = (keys.has('arrowright') ? 1 : 0) - (keys.has('arrowleft') ? 1 : 0); ky = (keys.has('arrowdown') ? 1 : 0) - (keys.has('arrowup') ? 1 : 0); }
  else { kx = (keys.has('d') ? 1 : 0) - (keys.has('a') ? 1 : 0); ky = (keys.has('s') ? 1 : 0) - (keys.has('w') ? 1 : 0); }
  if (!kx && !ky) return null;
  let x = kx, y = ky;
  if (rotated) { x = ky; y = -kx; }
  const m = Math.hypot(x, y);
  return { x: x / m, y: y / m, mag: 1 };
}
// the joystick of one side of this screen (0 near, 1 far)
function stickVec(p) {
  const pl = players[p], m = Math.hypot(pl.vx, pl.vy);
  if (pl.stickId === null || m < C.DEAD_ZONE) return IDLE;
  const s = p === 0 ? 1 : -1;   // the far player's controls are turned 180 degrees
  return { x: pl.vx / m * s, y: pl.vy / m * s, mag: Math.min(1, (m - C.DEAD_ZONE) / (0.85 - C.DEAD_ZONE)) };
}
// online, one person per device: any keys or the near stick drive this device's tank
function myInput() {
  const v = keyVec(0) || keyVec(1) || stickVec(0);
  return viewFlip && v.mag > 0 ? { x: -v.x, y: -v.y, mag: v.mag } : v;
}
function getInput(seat) {
  if (bots.has(seat)) return botInput(seat);
  if (mode === 'local') return soloMatch ? myInput() : (keyVec(seat) || stickVec(seat));
  if (seat === mySeat) return myInput();
  return remoteInput(seat);
}
function pressFire(seat) {
  if (state !== 'play' && state !== 'ending' && state !== 'result') return;
  const t = tanks[seat];
  if (!t) return;
  t.fireQ = 0.15;                // small buffer: a tap just before the cooldown ends still fires
  if (t.alive && !t.power && !t.guided && t.charge <= 0 && shotsLeft(t) <= 0) sfx.empty();
}
// a fire press from one side of this screen
function pressFireFrom(p) {
  if (mode === 'local') pressFire(soloMatch ? 0 : p);
  else if (mode === 'host') pressFire(mySeat);
  else guestFire();
}

/* ---------- computer tanks ----------
   A computer tank works the same stick and fire button as a person: it drives round the walls to
   the nearest enemy (or the hill, or a pickup), turns to face them when it has a clear line, fires
   after a short reaction time, and steps aside from shots coming straight at it. */
const unitTo = (dx, dy, mag) => { const d = Math.hypot(dx, dy); return d < 1e-6 ? IDLE : { x: dx / d, y: dy / d, mag }; };
function botInput(seat) {
  const t = tanks[seat], dt = C.STEP;
  if (!t || (state !== 'play' && state !== 'ending')) return IDLE;
  const ai = t.ai || (t.ai = { replan: 0, wp: null, react: 0.4 + Math.random() * 0.5, dodge: 0, da: 0, wander: 0, wa: 0, chk: 0.6, px: t.x, py: t.y });
  const foe = tanks[nearestEnemy(seat, t.x, t.y)], hasFoe = !!foe && foe.id !== seat && foe.alive;
  ai.react -= dt;
  if (t.guided && typeof t.guided === 'object') {
    // steering a guided missile: fly it at the enemy and set it off beside them
    const m = t.guided;
    if (!hasFoe) return IDLE;
    if (m.age >= C.GUIDED_ARM && Math.hypot(foe.x - m.x, foe.y - m.y) < 0.7) pressFire(seat);
    ai.replan -= dt;
    if (ai.replan <= 0 || !ai.wp) { ai.replan = 0.15; ai.wp = planWaypoint(m, foe); }
    return unitTo(ai.wp.x - m.x, ai.wp.y - m.y, 1);
  }
  if (!t.alive) return IDLE;
  if (ai.dodge > 0) { ai.dodge -= dt; return { x: Math.cos(ai.da), y: Math.sin(ai.da), mag: 1 }; }
  for (const b of bullets) {
    if (b.owner === seat && b.age < 0.3) continue;
    if (!canHurt(b.owner, t)) continue;
    const rx = t.x - b.x, ry = t.y - b.y;
    if (Math.hypot(rx, ry) > 2.2) continue;
    const sp = Math.hypot(b.vx, b.vy) || 1, along = (rx * b.vx + ry * b.vy) / sp, cross = (rx * b.vy - ry * b.vx) / sp;
    if (along <= 0 || Math.abs(cross) > 0.5 || !lineClear(b.x, b.y, t.x, t.y, C.BULLET_R)) continue;
    const side = cross >= 0 ? 1 : -1;                       // step off the shot's line, to the side already nearer
    ai.da = Math.atan2(-b.vx * side, b.vy * side); ai.dodge = 0.3;
    if (t.power === 'shield') pressFire(seat);
    return { x: Math.cos(ai.da), y: Math.sin(ai.da), mag: 1 };
  }
  if (ai.wander > 0) { ai.wander -= dt; return { x: Math.cos(ai.wa), y: Math.sin(ai.wa), mag: 1 }; }

  const cx = COLS / 2, cy = ROWS / 2;
  const los = hasFoe && lineClear(t.x, t.y, foe.x, foe.y, C.BULLET_R + 0.02);
  const dFoe = hasFoe ? Math.hypot(foe.x - t.x, foe.y - t.y) : 99;
  let goal = hasFoe ? foe : null, fight = hasFoe;
  if (settings.game === 'hill') {
    if (Math.hypot(t.x - cx, t.y - cy) > C.HILL_R * 0.45) { if (!(los && dFoe < 3)) { goal = { x: cx, y: cy }; fight = false; } }
    else if (!los) return hasFoe ? unitTo(foe.x - t.x, foe.y - t.y, 0.04) : IDLE;          // on the hill: stay and watch
  }
  if (settings.powerups && !t.power && !(los && dFoe < 3.5)) {
    let bd = 4.5, bk = null;
    for (const k of pickups) { const d = Math.hypot(k.x - t.x, k.y - t.y); if (d < bd) { bd = d; bk = k; } }
    if (bk) { goal = bk; fight = false; }
  }
  if (!goal) return IDLE;

  if (hasFoe && los) {
    const off = Math.abs(wrapAngle(Math.atan2(foe.y - t.y, foe.x - t.x) - t.angle));
    if (off < 0.13 && ai.react <= 0 && t.cool <= 0 && t.shield <= 0) { pressFire(seat); ai.react = 0.3 + Math.random() * 0.55; }
  } else if (hasFoe && ai.react <= 0 && (t.power === 'homing' || t.power === 'guided' || t.power === 'mine')) {
    pressFire(seat); ai.react = 0.6;                         // missiles and mines do not need a clear line
  }
  if (fight && los) return unitTo(foe.x - t.x, foe.y - t.y, dFoe > 3 ? 1 : 0.04);

  ai.replan -= dt;
  if (ai.replan <= 0 || !ai.wp) { ai.replan = 0.2; ai.wp = planWaypoint(t, goal, C.TANK_R + 0.04); }
  ai.chk -= dt;
  if (ai.chk <= 0) {                                         // not getting anywhere: try another way for a moment
    if (Math.hypot(t.x - ai.px, t.y - ai.py) < 0.1) { ai.wander = 0.45; ai.wa = Math.random() * Math.PI * 2; ai.wp = null; }
    ai.chk = 0.6; ai.px = t.x; ai.py = t.y;
    if (!ai.wp) return IDLE;
  }
  return unitTo(ai.wp.x - t.x, ai.wp.y - t.y, 1);
}

/* ---------- physics (always called with the fixed step) ---------- */
function stepPhysics(dt, lethal, control) {
  LETHAL = lethal;
  for (const t of tanks) {
    if (!t.alive) {
      if (lethal && respawnMode() && !t.gone && t.respawn > 0 && (t.respawn -= dt) <= 0) respawnTank(t);
      continue;
    }
    t.cool = Math.max(0, t.cool - dt);
    t.recoil = Math.max(0, t.recoil - dt * 8);
    t.shield = Math.max(0, t.shield - dt);
    if (t.reload > 0) { t.reload -= dt; if (t.reload <= 0) { t.reload = 0; t.ammo = clipSize(); sfx.reloaded(); netEv('sfx', 'reloaded', t.id); } }
    const locked = t.charge > 0 || t.guided !== null;      // charging a laser or steering a missile: the tank stands still
    if (t.charge > 0) {
      t.charge -= dt;
      t.laserPath = tracePath(t.x, t.y, t.angle);
      if (t.charge <= 0) { t.charge = 0; fireLaser(t); }
    }
    const inp = control && !locked ? getInput(t.id) : IDLE;
    if (inp.mag > 0) {
      // the stick sets a target heading; the tank turns toward it at a limited rate
      const diff = wrapAngle(Math.atan2(inp.y, inp.x) - t.angle);
      const maxTurn = C.TURN_RATE * dt;
      t.angle = wrapAngle(t.angle + clamp(diff, -maxTurn, maxTurn));
      // drive forward only as far as the tank already points the right way (pivot first, then go)
      const speed = C.TANK_SPEED * inp.mag * Math.max(0, Math.cos(diff));
      t.x += Math.cos(t.angle) * speed * dt;
      t.y += Math.sin(t.angle) * speed * dt;
    }
    resolveCircle(t, C.TANK_R);
    if (t.fireQ > 0) { if (control && fire(t)) t.fireQ = 0; else t.fireQ -= dt; }
    if (!t.power && !t.guided && t.charge <= 0) {
      for (let i = pickups.length - 1; i >= 0; i--) {
        const k = pickups[i];
        if (Math.hypot(k.x - t.x, k.y - t.y) < C.TANK_R + 0.24) { t.power = k.type; pickups.splice(i, 1); sfx.pickup(); netEv('sfx', 'pickup', t.id); break; }
      }
    }
  }

  for (let i = 0; i < tanks.length; i++) for (let j = i + 1; j < tanks.length; j++) {
    const a = tanks[i], b2 = tanks[j];
    if (!a.alive || !b2.alive) continue;
    const dx = b2.x - a.x, dy = b2.y - a.y, d = Math.hypot(dx, dy), min = C.TANK_R * 2;
    if (d < min && d > 1e-6) {
      const push = (min - d) / 2;
      a.x -= dx / d * push; a.y -= dy / d * push; b2.x += dx / d * push; b2.y += dy / d * push;
      resolveCircle(a, C.TANK_R); resolveCircle(b2, C.TANK_R);
    }
  }

  // bullets
  const hitR = C.TANK_R * 0.92 + C.BULLET_R;
  bulletLoop:
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.age += dt;
    if (b.pierce) {
      // a piercing shot goes straight through walls and is gone when it leaves the arena
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < 0 || b.y < 0 || b.x > COLS || b.y > ROWS) { bullets.splice(i, 1); continue; }
    } else {
      // move on each axis separately: hitting a wall while moving in x flips vx, in y flips vy
      b.x += b.vx * dt;
      if (circleHitsWall(b.x, b.y, C.BULLET_R)) { if (crack(b)) { bullets.splice(i, 1); continue; } b.x -= b.vx * dt; b.vx = -b.vx; b.bounces++; bounceFx(b); }
      b.y += b.vy * dt;
      if (circleHitsWall(b.x, b.y, C.BULLET_R)) { if (crack(b)) { bullets.splice(i, 1); continue; } b.y -= b.vy * dt; b.vy = -b.vy; b.bounces++; bounceFx(b); }
    }
    if (++b.tick % 2 === 0) { b.trail.push(b.x, b.y); if (b.trail.length > 22) b.trail.splice(0, 2); }
    if (b.age > (b.life || C.BULLET_LIFE) || b.bounces > (b.maxB ?? C.MAX_BOUNCES)) { bullets.splice(i, 1); continue; }
    // any shot sets off a mine it touches
    for (const mn of mines) {
      if (!mn.boom && Math.hypot(b.x - mn.x, b.y - mn.y) < C.MINE_R + C.BULLET_R) { mn.boom = true; bullets.splice(i, 1); continue bulletLoop; }
    }
    // a bullet shoots down the other player's missile
    for (let j = missiles.length - 1; j >= 0; j--) {
      const m = missiles[j];
      if (m.owner === b.owner) continue;
      if (Math.hypot(b.x - m.x, b.y - m.y) < C.MISSILE_R + C.BULLET_R + 0.03) {
        puff(m.x, m.y, m.owner); removeMissile(j); bullets.splice(i, 1); continue bulletLoop;
      }
    }
    if (!lethal) continue;
    for (const t of tanks) {
      if (!t.alive) continue;
      if (b.owner === t.id && b.age < C.SELF_SAFE_TIME) continue;
      if (!canHurt(b.owner, t)) continue;                  // shots pass through team-mates
      const dx = b.x - t.x, dy = b.y - t.y;
      if (dx * dx + dy * dy < hitR * hitR) {
        if (b.owner !== t.id && !b.extra && stats[b.owner]) stats[b.owner].h++;
        hit(t, b.owner); bullets.splice(i, 1); break;
      }
    }
  }

  // missiles
  const mHit = C.TANK_R * 0.92 + C.MISSILE_R;
  for (let i = missiles.length - 1; i >= 0; i--) {
    const m = missiles[i], owner = tanks[m.owner];
    m.age += dt;
    let speed;
    if (m.type === 'homing') {
      // hunt the tank it locked on to; if that one is gone, the nearest one left
      if (!tanks[m.target] || !tanks[m.target].alive) m.target = nearestEnemy(m.owner, m.x, m.y);
      const target = tanks[m.target] || tanks[m.owner];
      speed = C.HOMING_SPEED;
      if (target.alive && target.id !== m.owner) {
        m.replan -= dt;
        if (m.replan <= 0 || !m.wp) { m.replan = 0.15; m.wp = planWaypoint(m, target); }
        const diff = wrapAngle(Math.atan2(m.wp.y - m.y, m.wp.x - m.x) - m.angle);
        m.angle = wrapAngle(m.angle + clamp(diff, -C.HOMING_TURN * dt, C.HOMING_TURN * dt));
        speed *= Math.max(0.35, Math.cos(diff));           // slow down for sharp corners
      }
    } else {
      speed = C.GUIDED_SPEED;
      const inp = control && owner.alive && owner.guided === m ? getInput(m.owner) : IDLE;   // the owner's stick steers the missile
      if (inp.mag > 0) {
        const diff = wrapAngle(Math.atan2(inp.y, inp.x) - m.angle);
        m.angle = wrapAngle(m.angle + clamp(diff, -C.GUIDED_TURN * dt, C.GUIDED_TURN * dt));
      }
    }
    m.x += Math.cos(m.angle) * speed * dt; m.y += Math.sin(m.angle) * speed * dt;
    resolveCircle(m, C.MISSILE_R);
    if (++m.tick % 4 === 0) particles.push({ x: m.x - Math.cos(m.angle) * 0.18, y: m.y - Math.sin(m.angle) * 0.18, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, life: 0.35, max: 0.35, col: COL.graphite, size: 0.035 });

    if (m.type === 'guided' && (m.detonate || m.age > C.GUIDED_LIFE)) { removeMissile(i); blast(m); continue; }
    if (m.type === 'homing' && m.age > C.HOMING_LIFE) { puff(m.x, m.y, m.owner); removeMissile(i); continue; }
    let onMine = false;
    for (const mn of mines) if (!mn.boom && Math.hypot(m.x - mn.x, m.y - mn.y) < C.MINE_R + C.MISSILE_R) { mn.boom = true; onMine = true; }
    if (onMine) { removeMissile(i); if (m.type === 'guided') blast(m); else puff(m.x, m.y, m.owner); continue; }
    for (const t of tanks) {

// power-up symbols: bolt = laser, crosshair = homing missile, curved arrow = guided missile,
// shield outline = shield, fan = spread, spiked ball = mine, arrow through a bar = piercing shot
function drawGlyph(type, s, col) {
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = Math.max(1.5, s * 0.15); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  if (type === 'laser') {
    ctx.moveTo(s * 0.18, -s * 0.62); ctx.lineTo(-s * 0.34, s * 0.08); ctx.lineTo(s * 0.02, s * 0.08);
    ctx.lineTo(-s * 0.18, s * 0.62); ctx.lineTo(s * 0.34, -s * 0.1); ctx.lineTo(-s * 0.02, -s * 0.1); ctx.closePath(); ctx.fill();
  } else if (type === 'homing') {
    ctx.arc(0, 0, s * 0.36, 0, Math.PI * 2);
    ctx.moveTo(0, -s * 0.64); ctx.lineTo(0, -s * 0.16); ctx.moveTo(0, s * 0.64); ctx.lineTo(0, s * 0.16);
    ctx.moveTo(-s * 0.64, 0); ctx.lineTo(-s * 0.16, 0); ctx.moveTo(s * 0.64, 0); ctx.lineTo(s * 0.16, 0);
    ctx.stroke();
  } else if (type === 'guided') {
    ctx.moveTo(-s * 0.5, s * 0.48); ctx.quadraticCurveTo(-s * 0.5, -s * 0.3, s * 0.2, -s * 0.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 0.62, -s * 0.3); ctx.lineTo(s * 0.16, -s * 0.6); ctx.lineTo(s * 0.16, 0); ctx.closePath(); ctx.fill();
  } else if (type === 'shield') {
    ctx.moveTo(0, -s * 0.62); ctx.lineTo(s * 0.5, -s * 0.42); ctx.lineTo(s * 0.5, s * 0.02);
    ctx.quadraticCurveTo(s * 0.44, s * 0.46, 0, s * 0.66); ctx.quadraticCurveTo(-s * 0.44, s * 0.46, -s * 0.5, s * 0.02);
    ctx.lineTo(-s * 0.5, -s * 0.42); ctx.closePath(); ctx.stroke();
  } else if (type === 'spread') {
    const ends = [[-s * 0.52, -s * 0.4], [0, -s * 0.6], [s * 0.52, -s * 0.4]];
    for (const [x, y] of ends) { ctx.moveTo(0, s * 0.58); ctx.lineTo(x, y); }
    ctx.stroke();
    for (const [x, y] of ends) { ctx.beginPath(); ctx.arc(x, y, s * 0.13, 0, Math.PI * 2); ctx.fill(); }
  } else if (type === 'mine') {
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ctx.moveTo(Math.cos(a) * s * 0.3, Math.sin(a) * s * 0.3); ctx.lineTo(Math.cos(a) * s * 0.64, Math.sin(a) * s * 0.64); }
    ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, s * 0.34, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.rect(-s * 0.14, -s * 0.62, s * 0.28, s * 1.24);
    ctx.moveTo(-s * 0.68, 0); ctx.lineTo(s * 0.4, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 0.72, 0); ctx.lineTo(s * 0.36, -s * 0.24); ctx.lineTo(s * 0.36, s * 0.24); ctx.closePath(); ctx.fill();
  }
}

function drawMine(mn) {
  const r = P * C.MINE_R;
  ctx.save(); ctx.translate(mn.x * P, mn.y * P);
  ctx.strokeStyle = COL.graphite; ctx.fillStyle = COL.graphite; ctx.lineWidth = Math.max(1.5, P * 0.045); ctx.lineCap = 'round';
  ctx.globalAlpha = mn.armed ? 1 : 0.5;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); ctx.lineTo(Math.cos(a) * r * 1.6, Math.sin(a) * r * 1.6); }
  ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  // a light in the colour of the tank that laid it; it blinks once the mine is armed
  const lit = !mn.armed || REDUCED || Math.floor(mn.age * 3) % 2 === 0;
  ctx.fillStyle = lit ? penOf(mn.owner) : COL.paper; ctx.beginPath(); ctx.arc(0, 0, r * 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawPickup(k) {
  const pop = REDUCED ? 1 : Math.min(1, k.age / 0.25), bob = REDUCED ? 1 : 1 + 0.06 * Math.sin(k.age * 4);
  const r = P * 0.3 * pop * bob;
  ctx.save(); ctx.translate(k.x * P, k.y * P);
  ctx.globalAlpha = 1; ctx.fillStyle = COL.paper; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.save(); if (!REDUCED) ctx.rotate(k.age * 0.8);
  ctx.strokeStyle = COL.graphite; ctx.lineWidth = Math.max(1.5, P * 0.045); ctx.setLineDash([r * 0.5, r * 0.28]);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  drawGlyph(k.type, r * 0.92, COL.graphite);
  ctx.restore();
}

function drawTank(t) {
  const col = penOf(t.id);
  ctx.save();
  ctx.translate(t.x * P, t.y * P);
  if (t.power) {                                         // a dashed ring shows the other player that this tank is carrying a power-up
    ctx.strokeStyle = COL.graphite; ctx.lineWidth = Math.max(1.2, P * 0.03); ctx.globalAlpha = 0.75;
    ctx.setLineDash([P * 0.1, P * 0.08]); ctx.beginPath(); ctx.arc(0, 0, P * 0.46, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
  if (t.shield > 0) {                                    // shield: a solid ring in the tank's colour, blinking in its last second
    const dim = t.shield < 1 && !REDUCED && Math.floor(t.shield * 8) % 2 === 0;
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = Math.max(2, P * 0.06);
    ctx.beginPath(); ctx.arc(0, 0, P * 0.54, 0, Math.PI * 2);
    ctx.globalAlpha = dim ? 0.04 : 0.14; ctx.fill(); ctx.globalAlpha = dim ? 0.3 : 0.9; ctx.stroke(); ctx.globalAlpha = 1;
  }
  ctx.rotate(t.angle);
  const L = 0.64 * P, W = 0.52 * P, lw = Math.max(1.5, P * 0.045);
  ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.lineJoin = 'round';
  // treads
  ctx.fillStyle = col;
  rrect(-L / 2, -W / 2, L, W * 0.26, P * 0.04); ctx.fill();
  rrect(-L / 2, W / 2 - W * 0.26, L, W * 0.26, P * 0.04); ctx.fill();
  // hull
  ctx.fillStyle = COL.paper;
  rrect(-L / 2 + P * 0.03, -W / 2 + W * 0.2, L - P * 0.06, W * 0.6, P * 0.05); ctx.fill(); ctx.stroke();
  // barrel (kicks back when firing)
  const kick = t.recoil * P * 0.06;
  ctx.fillStyle = COL.paper;
  rrect(P * 0.04 - kick, -P * 0.055, P * 0.38, P * 0.11, P * 0.02); ctx.fill(); ctx.stroke();
  // turret
  ctx.fillStyle = t.power ? COL.graphite : col; ctx.beginPath(); ctx.arc(0, 0, P * 0.14, 0, Math.PI * 2); ctx.fill();
  if (teamsOn() && !twoSided() && t.id === mySeat) { ctx.fillStyle = COL.paper; ctx.beginPath(); ctx.arc(0, 0, P * 0.065, 0, Math.PI * 2); ctx.fill(); }
  ctx.restore();
}

function drawMissile(m) {
  const col = penOf(m.owner);
  ctx.save(); ctx.translate(m.x * P, m.y * P); ctx.rotate(m.angle);
  const L = 0.4 * P, W = 0.16 * P;
  ctx.lineWidth = Math.max(1.2, P * 0.035); ctx.strokeStyle = COL.graphite; ctx.fillStyle = col; ctx.lineJoin = 'round'; ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.moveTo(L * 0.55, 0); ctx.lineTo(L * 0.15, -W / 2); ctx.lineTo(-L * 0.4, -W / 2); ctx.lineTo(-L * 0.6, -W);
  ctx.lineTo(-L * 0.6, W); ctx.lineTo(-L * 0.4, W / 2); ctx.lineTo(L * 0.15, W / 2); ctx.closePath();
  ctx.fill(); ctx.stroke();
  if (m.type === 'homing') { ctx.fillStyle = COL.paper; ctx.fillRect(-L * 0.22, -W / 2, L * 0.16, W); }
  ctx.restore();
}

function drawPath(path) {
  ctx.beginPath(); ctx.moveTo(path[0].x * P, path[0].y * P);
  for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x * P, path[i].y * P);
  ctx.stroke();
}

function drawMark(m) {
  const rnd = mulberry32(m.seed);
  ctx.save(); ctx.translate(m.x * P, m.y * P);
  ctx.strokeStyle = m.col; ctx.lineWidth = Math.max(1.5, P * 0.05); ctx.lineCap = 'round'; ctx.globalAlpha = 0.85;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2 + rnd() * 0.5, r1 = P * (0.05 + rnd() * 0.06), r2 = P * (0.2 + rnd() * 0.22);
    ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
  }
  ctx.stroke();
  ctx.restore();
}

// where the small sound and quit/leave switches sit (shared by drawing and touch)
function switchSpots() {
  const inMatch = state !== 'title' && !NET_SCREENS.includes(state);
  if (land) {
    const size = Math.min(16, S * 0.09), y = LH - 16;
    return { size, sound: { x: JX0, y }, quit: inMatch ? { x: FX0, y } : null };
  }
  const size = Math.min(17, S * 0.12), y = LH - 19;
  return { size, sound: { x: inMatch ? LW / 2 - 50 : LW / 2, y }, quit: inMatch ? { x: LW / 2 + 50, y } : null };
}

function drawStrip(p, seat) {
  const pl = players[p];
  const online = mode !== 'local', single = !twoSided();
  // switches at the edge: sound, and back to the menu (two taps, so a slip does not end the match)
  const edgeSwitches = () => {
    const sp = switchSpots();
    label(muted ? 'sound off' : 'sound on', sp.sound.x, sp.sound.y, sp.size, COL.graphite, FONT_B, 0.65);
    if (sp.quit) label(quitArm > 0 && performance.now() - quitArm < 2500 ? (online ? 'leave? tap again' : 'quit? tap again') : (online ? 'leave' : 'menu'), sp.quit.x, sp.quit.y, sp.size, COL.graphite, FONT_B, 0.65);
  };
  const t = tanks[seat];
  if (!t || NET_SCREENS.includes(state)) {
    // online and not driving a tank (waiting, or watching a match that started without us)
    ctx.fillStyle = COL.graphite; ctx.globalAlpha = 0.5; ctx.fillRect(0, LH - 5, LW, 5); ctx.globalAlpha = 1;
    if (!NET_SCREENS.includes(state)) label('watching', land ? FX0 : LW / 2, CY0, Math.min(S * 0.3, LW * 0.08, 40), COL.graphite, FONT_D, 0.7);
    edgeSwitches();
    return;
  }
  const col = penOf(seat);
  // colour band along this player's edge of the tablet
  ctx.fillStyle = col; ctx.globalAlpha = 0.9; ctx.fillRect(0, LH - 5, LW, 5); ctx.globalAlpha = 1;

  // joystick (it appears where the thumb lands)
  const active = pl.stickId !== null;
  const bx = active ? pl.ox : JX0, by = active ? pl.oy : CY0;
  ctx.lineWidth = Math.max(2, JR * 0.06); ctx.strokeStyle = col;
  ctx.globalAlpha = active ? 0.9 : 0.6;
  ctx.setLineDash(active ? [] : [JR * 0.22, JR * 0.16]);
  ctx.beginPath(); ctx.arc(bx, by, JR, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  ctx.globalAlpha = active ? 0.9 : 0.35; ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(bx + pl.vx * JR, by + pl.vy * JR, JR * 0.42, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  if (!active) label(t.guided ? 'steer missile' : 'drive', bx, by + JR + Math.min(16, S * 0.1), Math.min(18, S * 0.12), col, FONT_B, 0.75);

  // fire button: its word says what the next press does
  const pressed = pl.fireId !== null, left = shotsLeft(t);
  let text = 'FIRE', fsz = FR * 0.56, hot = false, can = t.alive && left > 0;
  if (t.guided) { text = 'BOOM'; hot = true; can = true; }
  else if (t.charge > 0) { text = POWER_NAME.laser; fsz = FR * 0.42; hot = true; can = true; }
  else if (t.shield > 0) { text = POWER_NAME.shield; fsz = FR * 0.42; can = false; }
  else if (t.power) { text = POWER_NAME[t.power]; fsz = FR * 0.42; hot = true; can = t.alive; }
  else if (t.reload > 0) { const one = settings.ammo === 'single'; text = one ? 'WAIT' : 'RELOAD'; fsz = FR * (one ? 0.5 : 0.4); can = false; }
  else if (settings.ammo === 'limited' && left <= 0) { text = 'EMPTY'; fsz = FR * 0.44; can = false; }
  ctx.lineWidth = Math.max(2, FR * 0.07); ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.globalAlpha = pressed ? 0.5 : hot ? 0.32 : can ? 0.16 : 0.05;
  ctx.beginPath(); ctx.arc(FX0, CY0, FR * (pressed ? 0.94 : 1), 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = can ? 0.95 : 0.35; ctx.stroke();
  if (hot) { ctx.lineWidth = Math.max(1.5, FR * 0.04); ctx.beginPath(); ctx.arc(FX0, CY0, FR * 0.86, 0, Math.PI * 2); ctx.stroke(); }
  ctx.globalAlpha = 1;
  label(text, FX0, CY0 + FR * 0.04, fsz, col, FONT_D, can ? 1 : 0.45);

  // ammo dots, or an arc: reload progress filling up, or shield time running down
  const span = 0.36, n = settings.ammo === 'unlimited' ? C.MAX_BULLETS : clipSize();
  const arc = t.shield > 0 ? t.shield / C.SHIELD_TIME : t.reload > 0 ? 1 - t.reload / reloadTime() : -1;
  if (arc >= 0) {
    const a0 = -Math.PI / 2 - span * 2, a1 = -Math.PI / 2 + span * 2, k = clamp(arc, 0, 1);
    ctx.lineCap = 'round'; ctx.strokeStyle = COL.graphite; ctx.lineWidth = Math.max(3, FR * 0.09);
    ctx.globalAlpha = 0.22; ctx.beginPath(); ctx.arc(FX0, CY0, FR + 11, a0, a1); ctx.stroke();
    ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.arc(FX0, CY0, FR + 11, a0, a0 + (a1 - a0) * k); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineCap = 'butt';
  } else {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (i - (n - 1) / 2) * span;
      const x = FX0 + Math.cos(a) * (FR + 11), y = CY0 + Math.sin(a) * (FR + 11);
      ctx.beginPath(); ctx.arc(x, y, Math.max(3, FR * 0.075), 0, Math.PI * 2);
      ctx.lineWidth = 1.5; ctx.strokeStyle = COL.graphite; ctx.fillStyle = COL.graphite;
      if (i < left) { ctx.globalAlpha = 0.9; ctx.fill(); } else { ctx.globalAlpha = 0.4; ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
  }

  const fs = Math.min(S * 0.42, LW * 0.12), gap = fs * 0.32;
  if (!single) {
    // score: mine first, in my colour
    const other = penOf(1 - p);
    label(String(scores[p]), LW / 2 - gap, CY0, fs, col, FONT_D, 1, 'right');
    label(':', LW / 2, CY0 - fs * 0.04, fs * 0.8, COL.graphite, FONT_D, 0.7);
    label(String(scores[1 - p]), LW / 2 + gap, CY0, fs * 0.72, other, FONT_D, 0.85, 'left');
  } else if (land) {
    // landscape: my score at the top of the fire side, everyone's on the stick side
    const f2 = Math.min(S * 0.32, LH * 0.14, 56);
    label(String(scores[sideOf(seat)] | 0), FX0, LH * 0.13, f2, col, FONT_D);
    label('of ' + target(), FX0, LH * 0.13 + f2 * 0.62, f2 * 0.34, COL.graphite, FONT_B, 0.7);
  } else {
    // online the whole table is along the top; here just my own score and the target
    label(String(scores[sideOf(seat)] | 0), LW / 2, CY0 - fs * 0.12, fs, col, FONT_D);
    label('of ' + target(), LW / 2, CY0 + fs * 0.55, fs * 0.32, COL.graphite, FONT_B, 0.7);
  }
  edgeSwitches();
}

const short = (str, n) => str.length > n ? str.slice(0, n - 1) + '…' : str;
// online: the game code, this device's part in it, and how long its messages take
function netInfo() {
  const nDirect = mode === 'host' ? [...guests.values()].filter(x => linkOpen(x.u)).length : 0;
  const role = mode === 'host' ? 'hosting' + (usingRelay && guests.size ? ` · Wi-Fi direct ${nDirect}/${guests.size}` : '')
    : mode === 'guest' ? 'joined' + (linkOpen(gU) ? ' · Wi-Fi direct' : '') : '';
  const ping = mode === 'guest' && rttMs ? `${Math.round(rttMs)} ms` + (netRttMs ? ` (net ${netRttMs})` : '') : '';
  return [netCode ? `game ${netCode}` : '', role, ping];
}
const TEAM_NAME = ['Red', 'Blue'];
// one person per screen: every tank's score, the game mode and (online) the game code.
// Upright: a band along the top. Wide: a list at the top of the stick-side panel.
function drawTopBoard() {
  const net = mode !== 'local';
  const cx = land ? JX0 : LW / 2, panelW = land ? S : LW;
  ctx.fillStyle = COL.graphite; ctx.globalAlpha = 0.5; ctx.fillRect(0, 0, panelW, 4); ctx.globalAlpha = 1;
  const inMatch = !NET_SCREENS.includes(state) && state !== 'title';
  const lines = [];
  if (net) {
    const [code, role, ping] = netInfo();
    if (!code) lines.push('online');
    else if (land) { lines.push(code, role); if (ping) lines.push(ping); }
    else lines.push([code, role, ping].filter(Boolean).join(' · '));
  }
  if (inMatch) lines.push(`${GAME_NAME[settings.game === 'teams' && !teamsOn() ? 'classic' : settings.game]} · ${goalText()}`);
  const fs = land ? Math.min(15, S * 0.078) : Math.min(16, S * 0.115);
  let yy = land ? 16 : Math.min(S * 0.17, 20);
  for (const t of lines) { label(t, cx, yy, fs, COL.graphite, FONT_B, 0.7); yy += fs * 1.3; }
  if (!inMatch) return;
  const out = t => t && (t.gone || (!t.alive && (state === 'play' || state === 'ending')));
  const dot = (i, x, y, r) => {
    const t = tanks[i], col = penOf(i);
    ctx.globalAlpha = out(t) ? 0.3 : 1; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    if (settings.game === 'hill' && hillHolder === i) { ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, r * 0.3); ctx.beginPath(); ctx.arc(x, y, r * 1.6, 0, Math.PI * 2); ctx.stroke(); }
    ctx.globalAlpha = 1;
  };
  const who = i => i === mySeat ? (names[i] || 'you') : (t => t && t.gone ? 'left' : nameOf(i))(tanks[i]);
  if (land) {
    // wide: one row per tank under the info lines
    const step = Math.min(LH * 0.062, 30), r = step * 0.26, x0 = Math.max(10, S * 0.09), x1 = S - x0;
    let y = yy + step * 0.5;
    if (teamsOn()) {
      const f = step * 1.25;
      label(String(scores[0] | 0), cx - f * 0.35, y + f * 0.2, f, COL.pens[0], FONT_D, 1, 'right');
      label(':', cx, y + f * 0.16, f * 0.8, COL.graphite, FONT_D, 0.7);
      label(String(scores[1] | 0), cx + f * 0.35, y + f * 0.2, f, COL.pens[1], FONT_D, 1, 'left');
      y += f * 1.25;
    }
    for (let i = 0; i < NP; i++, y += step) {
      const t = tanks[i], col = penOf(i), dim = out(t);
      dot(i, x0 + r, y, r);
      label(short(who(i), 10), x0 + r * 3.2, y, step * 0.52, dim ? COL.graphite : col, i === mySeat ? FONT_D : FONT_B, dim ? 0.45 : 1, 'left');
      if (!teamsOn()) label(String(scores[i] | 0), x1, y, step * 0.66, dim ? COL.graphite : col, FONT_D, dim ? 0.45 : 1, 'right');
    }
    return;
  }
  // upright: side by side along the top
  const rowY = Math.max(yy + S * 0.14, S * 0.56);
  if (teamsOn()) {
    const f = Math.min(S * 0.34, 44), mine = mySeat >= 0 ? teamOf[mySeat] : -1;
    label(String(scores[0] | 0), cx - f * 0.4, rowY, f, COL.pens[0], FONT_D, 1, 'right');
    label(':', cx, rowY - f * 0.04, f * 0.8, COL.graphite, FONT_D, 0.7);
    label(String(scores[1] | 0), cx + f * 0.4, rowY, f, COL.pens[1], FONT_D, 1, 'left');
    [0, 1].forEach(k => label(TEAM_NAME[k] + (mine === k ? ' (you)' : ''), cx + (k ? 1 : -1) * f * 2.6, rowY, f * 0.36, COL.pens[k], FONT_B, 0.9));
    return;
  }
  const w = Math.min(panelW / NP, 130), x0 = cx - w * (NP - 1) / 2, r = Math.min(S * 0.16, w * 0.2, 22);
  for (let i = 0; i < NP; i++) {
    const t = tanks[i], x = x0 + i * w, col = penOf(i), dim = out(t);
    dot(i, x - r * 1.2, rowY, r * 0.75);
    label(String(scores[i] | 0), x + r * 0.5, rowY, r * 1.9, dim ? COL.graphite : col, FONT_D, dim ? 0.45 : 1);
    label(short(who(i), 9), x, rowY + r * 1.6, r * 0.8, i === mySeat ? col : COL.graphite, FONT_B, i === mySeat ? 0.9 : 0.6);
  }
}

// the waiting room: who is in it, as the host knows it or as a guest was last told
const lobbySnap = () => (snaps.length ? snaps[snaps.length - 1].g : null) || {};
const lobbySeats = () => mode === 'guest' ? (lobbySnap().seats || []) : seats;
const lobbyTeams = () => mode === 'guest' ? (lobbySnap().tm || []) : seats.map(id => teamPick.get(id) ? 1 : 0);
const lobbyNames = () => mode === 'guest' ? (lobbySnap().nm || []) : seats.map(seatLabel);
const lobbyCtl = () => mode === 'host' || (mode === 'guest' && isLeader);     // may this device change the room?
const inLobby = () => state === 'hostWait' || (state === 'guestWait' && !netMsg);

    ctx.globalAlpha = fade; ctx.fillStyle = COL.graphite;

    if (b.pierce) {                                      // a piercing shot wears a ring, so it reads as different from a bullet
      ctx.strokeStyle = penOf(b.owner); ctx.lineWidth = Math.max(1.5, P * 0.04);
      ctx.beginPath(); ctx.arc(b.x * P, b.y * P, C.BULLET_R * P * 2.2, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // a ring marks the tank a homing missile is hunting
  for (const m of missiles) {
    const tg = tanks[m.target];
    if (m.type !== 'homing' || !tg || !tg.alive || tg.id === m.owner) continue;
    const pulse = REDUCED ? 0 : 0.05 * Math.sin(m.age * 10);
    ctx.strokeStyle = penOf(m.owner); ctx.lineWidth = Math.max(1.5, P * 0.04); ctx.globalAlpha = 0.8;
    ctx.setLineDash([P * 0.14, P * 0.1]); ctx.beginPath(); ctx.arc(tg.x * P, tg.y * P, P * (0.5 + pulse), 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }
  if (!NET_SCREENS.includes(state)) for (const t of tanks) if (t.alive) drawTank(t);
  if (state === 'countdown' && !twoSided() && tanks[mySeat]) {
    // which tank is mine: a ring closes in on it while the round counts down
    const t = tanks[mySeat], k = REDUCED ? 0.5 : (stateT % 0.65) / 0.65;
    ctx.strokeStyle = penOf(mySeat); ctx.lineWidth = Math.max(2, P * 0.06); ctx.globalAlpha = 0.85 - 0.5 * k;
    ctx.beginPath(); ctx.arc(t.x * P, t.y * P, P * (1.25 - 0.6 * k), 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
  }
  for (const m of missiles) drawMissile(m);

  for (const b of beams) {
    const k = b.life / b.max;
    ctx.globalAlpha = k; ctx.strokeStyle = penOf(b.owner); ctx.lineWidth = P * 0.18 * (0.5 + 0.5 * k); drawPath(b.path);
    ctx.strokeStyle = COL.paper; ctx.lineWidth = P * 0.05; drawPath(b.path);
  }
  for (const r of rings) {
    const k = r.life / r.max;
    ctx.globalAlpha = k * 0.9; ctx.strokeStyle = r.col; ctx.lineWidth = Math.max(2, P * 0.07);
    ctx.beginPath(); ctx.arc(r.x * P, r.y * P, r.r * P * (1 - 0.6 * k), 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = k * 0.15; ctx.fillStyle = r.col; ctx.fill();
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x * P, p.y * P, Math.max(1, p.size * P), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  const menuish = state === 'title' || NET_SCREENS.includes(state), wide = !!lobbyFrames();
  if (wide) { ctx.globalAlpha = 0.93; ctx.fillStyle = COL.paper; ctx.fillRect(0, 0, LW, LH); ctx.globalAlpha = 1; }
  else if (menuish || state === 'matchEnd') {
    ctx.globalAlpha = menuish ? 0.9 : 0.72; ctx.fillStyle = COL.paper;
    ctx.fillRect(AX + 2, AY + 2, AW - 4, AH - 4); ctx.globalAlpha = 1;
  }
  if (twoSided()) {
    for (let p = 0; p < 2; p++) forPlayer(p, () => { drawStrip(p, p); drawOverlay(p, p); });
  } else {
    // one person per device: their controls along the bottom, everyone's scores along the top
    drawStrip(0, mySeat);
    if (!wide) drawTopBoard();
    if (NET_SCREENS.includes(state)) drawNetScreen(); else drawOverlay(0, mySeat);
  }
}

/* ---------- main loop: fixed time step ---------- */
let last = 0, acc = 0;
function frame(now) {
  if (wantKey() !== layoutKey) resize();
  if (!last) last = now;
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= C.STEP) { update(C.STEP); acc -= C.STEP; }
  if (!HEADLESS) render();
  requestAnimationFrame(frame);
}

/* ---------- touch: every finger is tracked by its pointerId ---------- */
function setStick(pl, f) {
  let dx = f.x - pl.ox, dy = f.y - pl.oy;
  const m = Math.hypot(dx, dy);
  if (m > JR) {            // the base follows a thumb that drifts too far
    pl.ox += dx / m * (m - JR); pl.oy += dy / m * (m - JR);
    dx = dx / m * JR; dy = dy / m * JR;
  }
  pl.vx = dx / JR; pl.vy = dy / JR;
}
function setMuted(v) { muted = v; try { localStorage.setItem('tankduel-muted', v ? '1' : '0'); } catch (e) {} }

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioInit();
  const q = toLogical(e);
  if (nameOpen) { closeName(true); return; }
  const oneScreen = twoSided();
  const p = !oneScreen || q.y > LH / 2 ? 0 : 1;   // which half of the screen = which player (online: one person per screen)
  const f = toPlayerFrame(p, q.x, q.y);
  const inMatch = state !== 'title';
  const sp = switchSpots(), near = (o, w) => o && Math.abs(f.x - o.x) < w && Math.abs(f.y - o.y) < 20;
  if (NET_SCREENS.includes(state)) {
    if (near(sp.sound, 46)) { setMuted(!muted); return; }
    const it = hitItem(netItems(), f); if (it) applyMenu(it);
    return;
  }
  // the small switches at the edge
  if (near(sp.sound, 46)) { setMuted(!muted); return; }
  if (near(sp.quit, 60)) {
    if (quitArm > 0 && performance.now() - quitArm < 2500) goMenu(); else quitArm = performance.now();
    return;
  }
  if (state === 'title') { const it = hitItem(menuItems(), f); if (it) applyMenu(it); return; }
  if (state === 'matchEnd') { if (stateT > 1.2) { const it = hitItem(endItems(), f); if (it) applyMenu(it); } return; }
  const pl = players[p];
  if (f.x < LW / 2) {
    if (pl.stickId !== null) return;
    pl.stickId = e.pointerId;
    pl.ox = clamp(f.x, JR * 0.6, LW / 2 - JR * 0.3);
    pl.oy = land ? clamp(f.y, JR * 0.6, LH - JR * 0.6) : clamp(f.y, LH - S + JR * 0.5, LH - JR * 0.5);
    setStick(pl, f);
  } else {
    pl.fireId = e.pointerId;
    pressFireFrom(p);
  }
});
canvas.addEventListener('pointermove', e => {
  for (const pl of players) {
    if (pl.stickId !== e.pointerId) continue;
    e.preventDefault();
    const q = toLogical(e);
    setStick(pl, toPlayerFrame(pl.id, q.x, q.y));
  }
});
function release(e) {
  for (const pl of players) {
    if (pl.stickId === e.pointerId) { pl.stickId = null; pl.vx = 0; pl.vy = 0; }
    if (pl.fireId === e.pointerId) pl.fireId = null;
  }
}
canvas.addEventListener('pointerup', e => { audioInit(); release(e); });
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('lostpointercapture', release);

// stop the browser from scrolling, zooming or selecting while four thumbs are on the glass
for (const type of ['touchstart', 'touchmove', 'touchend']) {
  document.addEventListener(type, e => {
    if (type === 'touchend') audioInit();
    if (e.target && e.target.closest && e.target.closest('#namebox')) return;      // the name box takes ordinary taps
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
}
for (const type of ['gesturestart', 'gesturechange', 'contextmenu', 'dblclick', 'selectstart']) {
  document.addEventListener(type, e => { if (!(e.target && e.target.closest && e.target.closest('#namebox'))) e.preventDefault(); });
}

// keyboard, for trying it on a computer: arrows + Enter, and W A S D + Space.
// In the menu: G = game mode, C = computer tanks, 1 2 3 4 = ammo, P = power-ups, B = breakable walls, M = maps, N = match length.
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'enter'].includes(k)) e.preventDefault();
  if (e.repeat || nameOpen) return;
  audioInit();
  keys.add(k);
  if (state === 'title') {
    if (k === 'o') { goOnline(); return; }
    if (k === ' ' || k === 'enter') beginFromMenu();
    else if (['1', '2', '3', '4'].includes(k)) setAmmoMode(AMMO_MODES[+k - 1]);
    else if (k === 'p') { settings.powerups = !settings.powerups; saveSettings(); }
    else if (k === 'm') { settings.maps = MAP_POOLS[(MAP_POOLS.indexOf(settings.maps) + 1) % MAP_POOLS.length]; saveSettings(); }
    else if (k === 'n') { settings.winScore = WIN_SCORES[(WIN_SCORES.indexOf(settings.winScore) + 1) % WIN_SCORES.length]; saveSettings(); menuFocus = 'win'; }
    else if (k === 'g') { settings.game = nextOf(GAME_MODES, settings.game); saveSettings(); menuFocus = 'game'; }
    else if (k === 'b') { settings.soft = !settings.soft; saveSettings(); menuFocus = 'soft'; }
    else if (k === 'c') { settings.cpu = (settings.cpu + 1) % 4; saveSettings(); menuFocus = 'cpu'; }
    return;
  }
  if (k === 'escape') { if (state === 'joinCode') { state = 'online'; netMsg = ''; } else goMenu(); return; }
  if (state === 'joinCode') {
    if (k === 'backspace') typeKey('del'); else if (k === 'enter') typeKey('join'); else typeKey(k);
    return;
  }
  if (state === 'online') { if (k === 'h') startHosting(); else if (k === 'j') { state = 'joinCode'; typedCode = ''; } return; }
  if (state === 'hostWait') { if (k === 'enter' || k === ' ') hostStart(); return; }
  if (state === 'guestWait' && isLeader) { if (k === 'enter' || k === ' ') sendCmd('start'); return; }
  if (NET_SCREENS.includes(state)) return;
  if (state === 'matchEnd') {
    if (stateT > 1.2 && (k === ' ' || k === 'enter')) { if (mode === 'host') hostStart(); else if (mode === 'guest') { if (isLeader) sendCmd('rematch'); } else startMatch(); }
    return;
  }
  if (mode !== 'local' || soloMatch) { if ([' ', 'enter', 'f', 'm', '/'].includes(k)) pressFireFrom(0); return; }
  if (k === 'enter' || k === '/' || k === 'm') pressFire(0);
  if (k === ' ' || k === 'f') pressFire(1);
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => { keys.clear(); players.forEach(pl => { pl.stickId = null; pl.fireId = null; pl.vx = 0; pl.vy = 0; }); });

addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
if (document.fonts && document.fonts.load) {
  document.fonts.load(`40px ${FONT_D}`).catch(() => {});
  document.fonts.load(`20px ${FONT_B}`).catch(() => {});
}

/* ---------- boot (keeps the score and mode if the page is refreshed by its viewer) ---------- */
function start(data) {
  if (data && validSettings(data.settings)) settings = validSettings(data.settings);
  mapOrder = mapPool();
  if (data && Array.isArray(data.scores) && data.scores.length === 2 && data.inMatch && settings.game === 'classic' &&
      data.scores.every(n => Number.isInteger(n) && n >= 0 && n < settings.winScore)) {
    scores = data.scores.slice(); mapIdx = (data.mapIdx | 0) || 0; resumeMatch = true;
  }
  loadMap(mapIdx);
  resetEntities();
  resize();
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({ scores: mode === 'local' ? scores : [0, 0], mapIdx, settings: savedSettings || settings,
  inMatch: mode === 'local' && !soloMatch && settings.game === 'classic' && state !== 'title' && state !== 'matchEnd' && !NET_SCREENS.includes(state) }));

// hooks for testing from the console
window.__tank = {
  C, MAPS, tanks, players, settings: () => settings, setSettings: s => { settings = validSettings(s) || settings; },
  get COLS() { return COLS; }, get ROWS() { return ROWS; }, get mapId() { return mapId; },
  showMap: i => { loadMap(i); resetEntities(); layout(); },
  loadMap, resetEntities, circleHitsWall, resolveCircle, stepPhysics, update, fire, kill, usePower, tracePath, castRay, planWaypoint,
  spawnPickups, menuItems, endItems, startRound, startMatch, goMenu, closeRing, ringCount,
  get roundT() { return roundT; }, set roundT(v) { roundT = v; }, get sdClosed() { return sdClosed; },
  get mapOrder() { return mapOrder; }, get crushed() { return crushed; },
  get state() { return state; }, set state(v) { state = v; stateT = 0; },
  get scores() { return scores; }, get bullets() { return bullets; }, get missiles() { return missiles; }, get pickups() { return pickups; },
  get beams() { return beams; }, get mines() { return mines; }, hit, bulletCount, POWER_TYPES, get walls() { return walls; }, get spawn() { return spawn; }, get winner() { return winner; },
  get layout() { return { LW, LH, P, AX, AY, AW, AH, S, JR, FR, JX0, FX0, CY0, rotated }; },
  net: { hostGame, joinGame, createGame, startHosting, sendCmd, get isLeader() { return isLeader; }, get dedicated() { return dedicatedGame; }, hostStart, hostLobby, goOnline, netItems, buildSnap, typeKey,
    get mode() { return mode; }, get seats() { return seats; }, get code() { return netCode; }, get msg() { return netMsg; },
    get mySeat() { return mySeat; }, get rtt() { return rttMs; }, get direct() { return mode === 'host' ? [...guests.values()].filter(x => linkOpen(x.u)).length : linkOpen(gU) ? 1 : 0; }, get netRtt() { return netRttMs; }, get interp() { return interpMs; }, get viewFlip() { return viewFlip; }, get guests() { return guests; }, get snaps() { return snaps; }, get NP() { return NP; } },
  get tanksNow() { return tanks; },
  get bots() { return bots; }, get teamOf() { return teamOf; }, get names() { return names; }, get stats() { return stats; },
  get soft() { return soft; }, get broken() { return broken; }, get hillHolder() { return hillHolder; }, get solo() { return soloMatch; },
  get NP() { return NP; }, get mode() { return mode; }, get land() { return land; }, get myName() { return myName; },
  setupLocal, beginFromMenu, applyMenu, breakWall, respawnTank, botInput, target, goalText, distField, mapPool, ROT4,
  lobbyFrames,
  lobby: { get seats() { return lobbySeats(); }, get teams() { return lobbyTeams(); }, get names() { return lobbyNames(); }, get bots() { return lobbyBots; }, toggleTeam, reseat }
};

if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
